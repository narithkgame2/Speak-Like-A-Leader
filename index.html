  else if(c.type==='done'&&lsess.kind==='lesson') cs('c-fx-ldone'); }
const LEAD=500;   // ms of quiet before audio that starts by itself, so the screen settles first (a tap plays at once)
async function lsListen(auto){ const c=lsess.cards[lsess.n]; stopAll(); c.step='listen'; render(); const t=++tok;
  if(auto&&!await wait(LEAD,t)) return;
  if(coachOn()&&!lsess.sayIntro){ lsess.sayIntro=true; if(!await coachSay('c-fx-say',t)||!await wait(250,t)) return; }
  if(!await lsModel(t)) return; if(t===tok&&lsess){ c.step='ready'; render(); } }
async function lsModel(t){ const c=lsess.cards[lsess.n], t0=performance.now(), clip=MINE[c.id]||(useFiles()&&AUDIO[c.clip])||pvClip(c.text,KCAST.you)||(lsess.kind==='prep'&&prepClip(c.text))||await pvWait(c.text,KCAST.you,t); let ok=true;
  if(t!==tok) return false;
  if(clip) ok=await playClip(clip,[...document.querySelectorAll('.w[data-l="L"]')],t);
  else for(const s of parseLine(c.text)){
    if(s.type==='pause'){ if(!(ok=await wait(800/state.rate,t))) break; }
    else if(s.type==='pause-long'){ if(!(ok=await wait(1700/state.rate,t))) break; }
    else if(s.type==='text'&&s.speak){ if(!(ok=await say(s.speak,t,{pitch:s.down?0.88:1}))) break; } }
  if(ok&&lsess) c.modelDur=(performance.now()-t0)/1000; return ok; }
function playUrl(url,t){ return new Promise(res=>{ if(!url||t!==tok) return res(false);
  recAudio=new Audio(url); recAudio.onended=()=>res(t===tok); recAudio.onerror=()=>res(false); recAudio.play().catch(()=>res(false)); }); }
async function lsRecord(){ const c=lsess.cards[lsess.n], key=lsess.n; stopAll();
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){ c.err=window.isSecureContext?'nomic':'insecure'; return render(); }
  c.step='arming'; c.err=null; render();
  try{ micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}}); }
  catch(e){ if(lsess&&lsess.n===key){ c.step='ready'; c.err=window.isSecureContext?'denied':'insecure'; render(); } return; }
  if(!lsess||lsess.n!==key||c.step!=='arming'){ releaseMic(); return; }
  const chunks=[], mr=new MediaRecorder(micStream), t0=Date.now();
  mr.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
  mr.onstop=async()=>{ releaseMic(); if(!lsess||lsess.n!==key) return;
    const blob=new Blob(chunks,{type:mr.mimeType||(chunks[0]&&chunks[0].type)||'audio/mp4'}); c.blob=blob;
    if(c.url) URL.revokeObjectURL(c.url); c.url=URL.createObjectURL(blob); c.step='review'; c.res='wait'; render();
    const r=await analyze(blob); if(lsess&&lsess.n===key&&c.step==='review'){ c.res=r; c.first=await trackTake(c.id,blob,r,lsess.t0); render();
      const k=judgeRes(r,c.modelDur,innerPauses(c.text),key).key; if(k==='good') c.good=true; if(coachOn()&&k){ const t=++tok; coachSay('c-fx-'+k,t); } } };
  rec={mr,timer:setInterval(()=>{ const s=(Date.now()-t0)/1000, el=$('recTime'); if(el) el.textContent=s.toFixed(1)+'s'; if(s>=40) stopRec(); },100)};
  mr.start(); c.step='rec'; render(); }
const quizText=t=>esc(personal(t).replace(/[‧↘*]/g,'').replace(/\s+/g,' ').trim()).replace(/\[([^\]]*)\]/g,'<i>$1</i>');
function lessonAct(a,btn){
  if(a==='nextup') return nextUp();

    IDB.set(c.id,take).then(()=>{ if(MINE[c.id]) URL.revokeObjectURL(MINE[c.id].url); MINE[c.id]={url:URL.createObjectURL(c.blob),start:take.start,stop:take.stop}; render(); }); return; }

    timerId=setInterval(()=>{ s--; el.textContent=Math.max(s,0); if(s<=0){ clearInterval(timerId); timerId=null; el.textContent='Time'; el.classList.add('up'); btn.textContent='Start timer'; } },1000); }
}

  const qListen=`<div class="q-listen"><button class="small-btn coach-btn" type="button" data-act="ls-qread">▶ Listen</button></div>`;
  const top=`<div class="fx-top"><button class="fx-x" type="button" data-act="ls-exit" aria-label="End lesson">${ICO.x}</button>

/* ---------------- GUIDED PRACTICE (scenarios) ----------------
   One of your lines at a time: listen → record → compare → next.
   Round 1 shows your line (read along). Round 2 hides it (from memory). */
let sess=null, rec=null, micStream=null, recAudio=null;
const SPEEDS=[0.7,0.85,1,1.15];
function altSpeaker(sc,who){ return who!=='you'&&who!=='stage'&&[...new Set(sc.lines.map(x=>x[0]).filter(x=>x!=='you'&&x!=='stage'))].indexOf(who)===1; }
function nameOf(sc,who){ return who==='you'?'You':(who.includes(':')?who.split(':')[1]:sc.them); }
function yourLines(sc){ return sc.lines.map((l,k)=>l[0]==='you'?k:-1).filter(k=>k>=0); }
function contextOf(sc,li){ const out=[]; for(let k=li-1;k>=0&&sc.lines[k][0]!=='you';k--) out.unshift(k); return out.slice(-2); }
function innerPauses(text){ const s=parseLine(text), first=s.findIndex(x=>x.type==='text'), last=s.map(x=>x.type).lastIndexOf('text');
  return s.filter((x,k)=>k>first&&k<last&&(x.type==='pause'||x.type==='pause-long')).length; }
function lineHTML(sc,li){ return parseLine(sc.lines[li][1]).map((s,si)=>segHTML(s,li,si)).join(' '); }

async function speakLine(sc,li,t,yv,tv){
  const [who,text]=sc.lines[li];
  if(who==='stage') return wait(1200/state.rate,t);
  const clip=clipFor(sc,li)||await pvWait(text,kCast(sc)[who],t); if(t!==tok) return false;
  if(clip) return playClip(clip,[...document.querySelectorAll(`.w[data-l="${li}"]`)],t);
  const segs=parseLine(text), mine=who==='you', alt=altSpeaker(sc,who);
  for(let si=0;si<segs.length;si++){ const s=segs[si];
    if(s.type==='pause'){ if(!await wait(800/state.rate,t)) return false; continue; }
    if(s.type==='pause-long'){ if(!await wait(1700/state.rate,t)) return false; continue; }
    if(s.type!=='text'||!s.speak) continue;
    const spans=[...document.querySelectorAll(`.w[data-l="${li}"][data-s="${si}"]`)];
    const ok=await say(s.speak,t,{voice:mine?yv:tv, pitch:(s.down?0.88:1)*(!mine&&yv===tv?1.15:1)*(alt?0.85:1), onb:e=>{ if(e.name&&e.name!=='word') return; let hit=null; spans.forEach(x=>{ if(+x.dataset.c<=e.charIndex) hit=x; }); spans.forEach(x=>x.classList.toggle('on',x===hit)); }});
    spans.forEach(x=>x.classList.remove('on')); if(!ok) return false; }
  return true;
}
async function speakModel(t){ const sc=SCENARIOS[sess.i], li=sess.lines[sess.k], yv=pickVoice(), t0=performance.now();
  const ok=await speakLine(sc,li,t,yv,themVoice(yv)); if(ok&&sess) sess.modelDur[li]=(performance.now()-t0)/1000; return ok; }
function playMe(t){ return new Promise(res=>{ if(!sess||!sess.url||t!==tok) return res(false);
  recAudio=new Audio(sess.url); recAudio.onended=()=>res(t===tok); recAudio.onerror=()=>res(false); recAudio.play().catch(()=>res(false)); }); }
async function runBtn(btn,fn){ const same=activeBtn===btn; stopAll(); if(same) return;
  const t=++tok; activeBtn=btn; btn.dataset.html=btn.innerHTML; btn.classList.add('playing'); if(!btn.classList.contains('spk')) btn.textContent='■ Stop';
  await fn(t); if(t===tok) stopAll(); }

/* Start a scenario straight into practice. The first card is the setting (the coach reads it), then the lines.
   Round 2 (from memory) is picked automatically once round 1 is done. */
function startScenario(i){ if(state.scDone[i]&&(ROUND3[i]||[]).length) return startR3(i); startSession(i,(state.scR1||{})[i]?2:1,true); }
function startSession(i,round,intro){ const from=sess?sess.from:['home','scenarios'].includes(state.route.name)?state.route.name:'home';
  endSession(); endLesson(); sess={i,round,k:0,lines:yourLines(SCENARIOS[i]),modelDur:{},peek:false,from,t0:Date.now()};
  state.route={name:'scenario',i}; state.lastSc=i; save();
  if(!intro){ enterLine(); window.scrollTo(0,0); return; }
  sess.step='intro'; render(); window.scrollTo(0,0);
  if(coachOn()){ const t=++tok; wait(LEAD,t).then(ok=>ok&&coachSay(`c-sc${i}-intro`,t)).then(ok=>{ if(ok&&sess&&sess.i===i&&sess.step==='intro') enterLine(); }); } }   // after the setting is read, the lines start by themselves
function endSession(){ stopAll(); cancelRec(); if(sess&&sess.url) URL.revokeObjectURL(sess.url); sess=null; }
function enterLine(){ if(sess.url) URL.revokeObjectURL(sess.url); if(sess.first) URL.revokeObjectURL(sess.first.url); Object.assign(sess,{url:null,res:null,err:null,peek:false,first:null}); listen(true); }
async function listen(auto){ const sc=SCENARIOS[sess.i], li=sess.lines[sess.k], yv=pickVoice(), tv=themVoice(yv), note=sc.lines[li][2];
  stopAll(); sess.step='listen'; render();
  const t=++tok, coach=coachOn(); if(auto&&!await wait(LEAD,t)) return;
  if(coach&&!sess.introDone){ sess.introDone=true; const cue=sess.round===1?'r1':'r2'; state.cues=state.cues||{};   // the round explanation plays once, ever
    if(!state.cues[cue]){ state.cues[cue]=true; save(); if(!await coachSay('c-fx-'+cue,t)||!await wait(300,t)) return; } }
  for(const c of contextOf(sc,li)){ if(!await speakLine(sc,c,t,yv,tv)) return; if(!await wait(350/state.rate,t)) return; }
  if(sess.round===1){ if(coach&&note&&(!await coachSay(`c-s${sess.i}-l${li}`,t)||!await wait(250,t))) return; if(!await speakModel(t)) return; }
  else if(coach&&!await coachSay('c-fx-turn',t)) return;
  if(t===tok){ sess.step='ready'; render(); } }

async function startRec(){ stopAll();
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){ sess.err=window.isSecureContext?'nomic':'insecure'; render(); return; }
  sess.step='arming'; sess.err=null; render(); const key=sess.k;
  try{ micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}}); }
  catch(e){ if(sess&&sess.k===key){ sess.step='ready'; sess.err=window.isSecureContext?'denied':'insecure'; render(); } return; }
  if(!sess||sess.k!==key||sess.step!=='arming'){ releaseMic(); return; }
  const chunks=[], mr=new MediaRecorder(micStream), t0=Date.now();
  mr.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
  mr.onstop=async()=>{ releaseMic(); if(!sess||sess.k!==key) return;
    const blob=new Blob(chunks,{type:mr.mimeType||(chunks[0]&&chunks[0].type)||'audio/mp4'});
    if(sess.url) URL.revokeObjectURL(sess.url); sess.url=URL.createObjectURL(blob); sess.step='review'; sess.res='wait'; render();
    const r=await analyze(blob); if(sess&&sess.k===key&&sess.step==='review'){ sess.res=r; sess.first=await trackTake(lineId(sess.i,sess.lines[key]),blob,r,sess.t0); render(); const k=judge().key; if(k==='good'&&sess.round===2) (sess.good=sess.good||new Set()).add(sess.k); if(coachOn()&&k){ const t=++tok; coachSay('c-fx-'+k,t); } } };
  rec={mr,timer:setInterval(()=>{ const s=(Date.now()-t0)/1000, el=$('recTime'); if(el) el.textContent=s.toFixed(1)+'s'; if(s>=40) stopRec(); },100)};
  mr.start(); sess.step='rec'; sess.err=null; render(); }
function stopRec(){ if(!rec) return; clearInterval(rec.timer); const r=rec; rec=null; if(r.mr.state!=='inactive') r.mr.stop(); }
function cancelRec(){ if(rec){ clearInterval(rec.timer); rec.mr.onstop=null; if(rec.mr.state!=='inactive') rec.mr.stop(); rec=null; } releaseMic(); }
function releaseMic(){ if(micStream) micStream.getTracks().forEach(x=>x.stop()); micStream=null; }

/* Rough speech measurements from the recording: speaking time, pauses, and a waveform. */
async function analyze(blob){ try{
  const AC=window.AudioContext||window.webkitAudioContext, ac=new AC(), buf=await ac.decodeAudioData(await blob.arrayBuffer()); try{ ac.close(); }catch(e){}
  const d=buf.getChannelData(0), fr=Math.max(1,Math.round(buf.sampleRate*0.02)), n=Math.floor(d.length/fr), rms=new Float32Array(n);
  for(let f=0;f<n;f++){ let s=0; for(let k=f*fr;k<(f+1)*fr;k++) s+=d[k]*d[k]; rms[f]=Math.sqrt(s/fr); }
  const sorted=[...rms].sort((a,b)=>a-b), noise=sorted[Math.floor(n*0.1)]||0, peak=sorted[Math.floor(n*0.98)]||0;
  if(peak<0.01||peak<noise*2.5) return {empty:true};
  const thr=noise+(peak-noise)*0.18, loud=[...rms].map(v=>v>thr), a=loud.indexOf(true), b=loud.lastIndexOf(true);
  let pauses=0, run=0; for(let f=a;f<=b;f++){ if(!loud[f]) run++; else { if(run>=18) pauses++; run=0; } }
  const N=60, bars=[]; for(let k=0;k<N;k++){ const s=Math.floor(k*n/N), e=Math.max(s+1,Math.floor((k+1)*n/N)); let m=0; for(let f=s;f<e;f++) m=Math.max(m,rms[f]); bars.push([Math.min(1,m/peak), m<=thr]); }
  const voiced=[]; for(let f=a;f<=b;f++) if(loud[f]) voiced.push(f);
  const avg=arr=>arr.reduce((t,f)=>t+rms[f],0)/arr.length, end=voiced.length>40?avg(voiced.slice(-15))/avg(voiced):null;
  return {speech:(b-a+1)*0.02, pauses, bars, end, a:a*0.02, b:(b+1)*0.02};
}catch(e){ return null; } }
function waveSVG(bars,dim){ return `<svg class="wave${dim?' dim':''}" viewBox="0 0 120 32" preserveAspectRatio="none" aria-hidden="true">${bars.map(([h,sil],k)=>{ const H=Math.max(1.5,h*30); return `<rect${sil?' class="sil"':''} x="${k*2}" y="${(32-H)/2}" width="1.3" height="${H}" rx=".6"/>`; }).join('')}</svg>`; }
/* Verdict for the result banner: good (green), almost (gold) or neutral (blue). */
function judge(){ const li=sess.lines[sess.k]; return judgeRes(sess.res,sess.modelDur[li],innerPauses(SCENARIOS[sess.i].lines[li][1]),sess.k); }
function judgeRes(r,md,exp,n){
  if(r==='wait') return {v:'neutral',t:'Listening back…',items:[]};
  if(!r) return {v:'neutral',t:'Recorded',items:[],tip:'Play both and compare.'};
  if(r.empty) return {v:'almost',t:'No speech heard',items:[],tip:'Check the microphone, then try again.',key:'nospeech'};
  const items=[]; let ok=true, fail=null;
  if(md){ const ratio=r.speech/md, nums=`${r.speech.toFixed(1)}s, model ${md.toFixed(1)}s.`;
    if(ratio<0.8){ ok=false; fail=fail||'pace'; items.push(`<b>Pace</b> ${nums} Slow down and let the pauses land.`); }
    else items.push(`<b>Pace</b> ${nums} ${ratio>1.4?'Slower is fine if the pauses were on purpose.':'Close to the model.'}`); }
  if(exp){ if(r.pauses<exp){ ok=false; fail=fail||'pause'; items.push(`<b>Pauses</b> ${r.pauses} of ${exp}. Hold each ‧‧‧ for a full beat.`); }
    else items.push(`<b>Pauses</b> ${r.pauses} of ${exp}. ${r.pauses>exp+2?'Fine if deliberate, not if you were searching for words.':'Right where they belong.'}`); }
  if(r.end!=null){ if(r.end<0.55){ ok=false; fail=fail||'end'; items.push(`<b>Ending</b> your last word dropped to ${Math.round(r.end*100)}% of your volume. Keep it strong to the final word.`); }
    else items.push('<b>Ending</b> held to the last word.'); }
  const TIP={pace:'Slow down. Let the pauses land.',pause:'Hold each pause a full beat.',end:'Keep the last word strong.'};

function act(a,btn){

/* ---------------- BACKUP ----------------
   Progress lives on this device only. "Back up" packs one file: progress, meeting prep, your recordings and first
   takes (not the lines the phone makes itself; those rebuild). Two taps on purpose: preparing takes a moment, and
   iPhones only open the share sheet straight from a tap. "Restore" reads the file back on any device. */
let BK=null;   // the prepared backup file
const blobTo64=b=>new Promise(r=>{ const f=new FileReader(); f.onload=()=>r(f.result); f.readAsDataURL(b); });
async function bkPack(v){ if(v instanceof Blob) return {__blob:await blobTo64(v)}; if(Array.isArray(v)||!v||typeof v!=='object') return v;
  const o={}; for(const [k,x] of Object.entries(v)) o[k]=await bkPack(x); return o; }
async function bkUnpack(v){ if(v&&v.__blob) return (await fetch(v.__blob)).blob(); if(Array.isArray(v)||!v||typeof v!=='object') return v;
  const o={}; for(const [k,x] of Object.entries(v)) o[k]=await bkUnpack(x); return o; }
async function bkPrepare(){ const out={app:'speak-like-a-leader',v:1,at:new Date().toISOString(),state:JSON.parse(localStorage.getItem(KEY)||'{}'),takes:{},history:{}};
  for(const store of ['takes','history']) for(const k of (await IDB.req('readonly',s=>s.getAllKeys(),store))||[]){
    if(String(k).startsWith('pv:')) continue; out[store][k]=await bkPack(await IDB.req('readonly',s=>s.get(k),store)); }
  BK=new File([JSON.stringify(out)],`speak-like-a-leader-backup-${ymd(new Date())}.json`,{type:'application/json'}); }
function bkSave(){ const f=BK; if(!f) return; const done=()=>{ state.lastBackup=Date.now(); save(); BK=null; render(); };
  const dl=()=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(f); a.download=f.name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },2000); done(); };
  if(navigator.canShare&&navigator.canShare({files:[f]})) navigator.share({files:[f],title:'Speak Like a Leader backup'}).then(done).catch(e=>{ if(e&&e.name==='AbortError') return; dl(); });
  else dl(); }
async function bkRestore(file){ let d=null; try{ d=JSON.parse(await file.text()); }catch(e){}
  if(!d||d.app!=='speak-like-a-leader'||!d.state) return alert("That file isn't a Speak Like a Leader backup.");
  const when=new Date(d.at).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});
  if(!confirm(`Restore the backup from ${when}? It replaces the progress on this device.`)) return;
  for(const store of ['takes','history']){
    for(const k of (await IDB.req('readonly',s=>s.getAllKeys(),store))||[]) if(!String(k).startsWith('pv:')) await IDB.req('readwrite',s=>s.delete(k),store);
    for(const [k,v] of Object.entries(d[store]||{})){ const val=await bkUnpack(v); await IDB.req('readwrite',s=>s.put(val,k),store); } }
  localStorage.setItem(KEY,JSON.stringify(Object.assign(d.state,{route:{name:'home'}}))); location.reload(); }
function bkLast(){ return state.lastBackup?new Date(state.lastBackup).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}):'never'; }

const TABS=[['home','Learn','<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>'],['prep','Prep','<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/>'],['lessons','Lessons','<path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/>'],['scenarios','Scenarios','<path d="M5 4h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-8l-5 4v-4H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/>'],['settings','Settings','<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>']];

  $('topStats').innerHTML=`<span class="stat fire${practicedToday()?'':' off'}" title="Days in a row">${ICO.fire}${streak()}<small>${streak()===1?'day':'days'}</small></span><span class="stat chk" title="Lessons and scenarios done">${ICO.done}${done}<small>done</small></span>`;
  $('tabbar').innerHTML=TABS.map(([k,label,icon])=>{ const on=(k===n)||(k===parent);
    return `<button type="button" class="tb ${on?'on':''}" data-go="${k}" ${on?'aria-current="page"':''}><svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${icon}</svg><span>${label}</span></button>`; }).join('');
  const main=$('main'); main.className=n==='home'?'home':'';
  main.innerHTML = welcome?viewWelcome(): n==='session'?viewLessonSession(): n==='prep'?viewPrep(): n==='prepedit'?viewPrepEdit(): n==='lessons'?viewLessons(): n==='lesson'?viewLesson(r.i): n==='scenarios'?viewScenarios(): n==='scenario'?viewScenario(r.i): n==='settings'?viewSettings(): n==='studio'?viewStudio(): viewHome();
  if(welcome){ bindBuilder(); return; }
  bind(n,r.i);
  if(n==='home') drawScene();
}
function bindBuilder(){ const map={bName:'name',bWho:'who',bGet:'get',bAvoid:'avoid'};
  Object.keys(map).forEach(id=>$(id).addEventListener('input',e=>{ state.intro[map[id]]=e.target.value.trim(); save(); const t=introLine(); $('built').innerHTML=t?fmt(t):'Your line appears here.'; }));
  $('bPlay')?.addEventListener('click',e=>{ const t=introLine(), c=state.intro.name&&pvClip("Good to meet you. I'm {name}. ‧‧‧ {intro}",KCAST.you);
    if(c&&t===personal("Good to meet you. I'm {name}. ‧‧‧ {intro}")) return runBtn(e.currentTarget,tk=>playClip(c,[],tk)); if(t) playSegs(e.currentTarget, segsOf(t)); }); }
function bind(n,i){
  document.querySelectorAll('#main [data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go, b.dataset.i!==undefined?+b.dataset.i:undefined)));
  if(n==='lesson'){ if(lsess){ if(lsess.cards[lsess.n].type==='builder') bindBuilder(); return; } const l=LESSONS[i];
    // The same voice as the lesson cards: the recorded clip, or the line made on this device, else the device voice.
    document.querySelectorAll('[data-pair]').forEach(b=>b.addEventListener('click',()=>{ const k=+b.dataset.pair, p=l.pairs[k], c=!p.lang&&((useFiles()&&AUDIO[`l${i}-p${k}`])||pvClip(p.better,KCAST.you));
      if(c) return runBtn(b,t=>playClip(c,[],t)); if(!p.lang&&useFiles()&&isPersonal(p.better)&&PV.state!=='fail') return runBtn(b,async t=>{ const w=await pvWait(p.better,KCAST.you,t); if(w) await playClip(w,[],t); });
      playSegs(b, segsOf(p.better), p.lang); }));
    $('drillPlay').addEventListener('click',e=>{ const b=e.currentTarget, dm=drillMarkup(l.drill.script), c=(useFiles()&&AUDIO[`l${i}-d`])||pvClip(dm,KCAST.you);
      if(c) return runBtn(b,t=>playClip(c,[],t)); if(useFiles()&&isPersonal(dm)&&PV.state!=='fail') return runBtn(b,async t=>{ const w=await pvWait(dm,KCAST.you,t); if(w) await playClip(w,[],t); });
      playSegs(b, segsOf(dm)); });
    if(l.builder) bindBuilder();
    if(l.practice){ let last=-1; const P=l.practice, nt=$('newTopic'), st=$('startT'), tm=$('timer'), tp=$('topic');
      nt.addEventListener('click',()=>{ if(timerId){ clearInterval(timerId); timerId=null; } let k; do{ k=Math.floor(Math.random()*P.list.length); }while(k===last&&P.list.length>1); last=k; tp.textContent=P.list[k]; tm.textContent=P.secs; tm.classList.remove('up'); st.disabled=false; st.textContent='Start timer'; });
      st.addEventListener('click',()=>{ if(timerId){ clearInterval(timerId); timerId=null; st.textContent='Start timer'; return; } let s=P.secs; tm.textContent=s; tm.classList.remove('up'); st.textContent='Stop';
        timerId=setInterval(()=>{ s--; tm.textContent=Math.max(s,0); if(s<=0){ clearInterval(timerId); timerId=null; tm.textContent='Time'; tm.classList.add('up'); st.textContent='Start timer'; } },1000); }); }
    const d=new Date(), ds=`${d.getDate()}/${d.getMonth()+1}`, arr=state.ratings[i]||[], today=arr.length&&arr[arr.length-1].d===ds?arr[arr.length-1].s:null;
    document.querySelectorAll('.rate-btn').forEach(b=>{ if(+b.dataset.s===today) b.classList.add('on'); b.addEventListener('click',()=>{ const a=state.ratings[i]||[]; if(a.length&&a[a.length-1].d===ds) a[a.length-1].s=+b.dataset.s; else a.push({d:ds,s:+b.dataset.s}); state.ratings[i]=a; markDay(); save();
      document.querySelectorAll('.rate-btn').forEach(x=>x.classList.toggle('on',x===b)); }); });
    $('own').addEventListener('input',e=>{ state.own[i]=e.target.value; save(); });
    $('note').addEventListener('input',e=>{ state.notes[i]=e.target.value; save(); });
    $('doneBtn').addEventListener('click',()=>{ state.done[i]=true; markDay(); save(); const nx=pathNeighbour('lesson',i,1); if(nx!=null) go('lesson',nx); else go('lessons'); });
  }
  if(n==='scenario'&&!sess){
    $('coachT').addEventListener('change',e=>{ state.coach=e.target.checked; save(); document.querySelector('.sc-script').classList.toggle('no-coach',!state.coach); });
    $('scOwn').addEventListener('input',e=>{ state.scOwn[i]=e.target.value; save(); });
  }
  if(n==='studio'){
    $('useMine').addEventListener('change',e=>{ state.useMine=e.target.checked; save(); });
    document.querySelectorAll('.studio-sc').forEach(d=>d.addEventListener('toggle',()=>{ const si=+d.dataset.si; d.open?studioOpen.add(si):studioOpen.delete(si); }));
  }
  if(n==='settings'){
    $('voiceSel')?.addEventListener('change',e=>{ state.voice=e.target.value; save(); });
    $('coachVoiceT').addEventListener('change',e=>{ state.coachVoice=e.target.checked; save(); });
    $('rate').addEventListener('input',e=>{ state.rate=+e.target.value; $('rateVal').textContent=state.rate.toFixed(2)+'×'; save(); });
    $('testVoice').addEventListener('click',e=>{ const b=e.currentTarget, c=AUDIO['l1-p0']; if(useFiles()&&c) runBtn(b,t=>playClip(c,[],t)); else playSegs(b, segsOf('Good to meet you. ‧‧‧ Thank you for your time. ↘')); });
    document.querySelectorAll('[data-src]').forEach(b=>b.addEventListener('click',()=>{ stopAll(); state.voiceSrc=b.dataset.src; save(); render(); }));
    $('bkBtn')?.addEventListener('click',async e=>{ const b=e.currentTarget; b.disabled=true; b.textContent='Preparing…'; try{ await bkPrepare(); }catch(err){ alert('The backup could not be prepared.'); } render(); });
    $('bkSave')?.addEventListener('click',bkSave);
    $('bkFile').addEventListener('change',e=>{ const f=e.target.files[0]; if(f) bkRestore(f); e.target.value=''; });
    $('resetBtn').addEventListener('click',()=>{ if(confirm('Reset all progress, ratings and notes? This cannot be undone.')){ const keep={rate:state.rate,voice:state.voice}; try{ localStorage.removeItem(KEY); }catch(e){} state=Object.assign({route:{name:'home'},done:{},own:{},notes:{},ratings:{},intro:{name:'',who:'',get:'',avoid:''},scMode:'shadow',coach:true,scOwn:{},scDone:{},lastSc:null},keep); save(); render(); } });
  }
}
$('tabbar').addEventListener('click',e=>{ const b=e.target.closest('[data-go]'); if(b) go(b.dataset.go); });
let trailT; addEventListener('resize',()=>{ clearTimeout(trailT); trailT=setTimeout(()=>{ if(state.route.name==='home') drawScene(); },100); });
if(document.fonts) document.fonts.ready.then(()=>{ if(state.route.name==='home') drawScene(); });
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{ if(state.route.name==='home') drawScene(); });
$('backBtn').addEventListener('click',()=>{ if(sess) act('exit'); else go($('backBtn').dataset.go); });
$('main').addEventListener('click',e=>{ const b=e.target.closest('[data-act]'); if(b) act(b.dataset.act,b); });
load(); state.route={name:'home'}; render(); scrollToNow(); offlineInit(); setTimeout(()=>loadMineReady.then(pvBuild),1000);   // every visit opens on the mountain, at your current step
const loadMineReady=loadMine().then(()=>{ if(['studio','settings'].includes(state.route.name)) render(); });

</script>
