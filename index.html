<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Speak Like an Advisor — High-Stakes Presence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>:root{
  --bg:#F6F4EF; --bg-2:#EFECE5; --card:#FFFFFF; --line:#E5E0D6; --line-d:#D8D1C4; --text:#1B2129; --dim:#5F6670; --mute:#9A9FA6;
  --ink:#1B2430; --ink-d:#0B1017; --on-ink:#FFFFFF;
  --pri:#2F7D5B; --pri-d:#24634A; --pri-soft:#E7F1EB;
  --blue:#2F5E9E; --blue-d:#244B80; --blue-soft:#E8EEF6;
  --gold:#B8893B; --gold-d:#94702F; --gold-soft:#F6EEDF; --gold-hi:#D4AE68; --gold-text:#8A6626; --trail:rgba(27,33,41,.5); --trail-bed:rgba(255,255,255,.45);
  --red:#B4473A; --red-d:#933A2F; --red-soft:#F7E7E4;
  --shadow:0 1px 2px rgba(20,24,30,.05), 0 8px 24px -14px rgba(20,24,30,.25);
  --serif:'Spectral',Georgia,serif; --sans:'Inter',system-ui,-apple-system,sans-serif;
  --tabh:64px; box-sizing:border-box; padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1216; --bg-2:#161A20; --card:#171B22; --line:#2A3038; --line-d:#20252C; --text:#ECE8E1; --dim:#A7ADB5; --mute:#6C737C;
  --ink:#ECE8E1; --ink-d:#B9B3A9; --on-ink:#12161B;
  --pri:#5DAE87; --pri-soft:#162820; --blue:#7FA6DC; --blue-soft:#152233; --gold:#D1A55A; --gold-soft:#2A2216; --gold-text:#DDB673; --trail:rgba(255,255,255,.5); --trail-bed:rgba(255,255,255,.06); --red:#DE7D70; --red-soft:#2E1B19;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.6); } }
:root[data-theme="dark"]{
  --bg:#0F1216; --bg-2:#161A20; --card:#171B22; --line:#2A3038; --line-d:#20252C; --text:#ECE8E1; --dim:#A7ADB5; --mute:#6C737C;
  --ink:#ECE8E1; --ink-d:#B9B3A9; --on-ink:#12161B;
  --pri:#5DAE87; --pri-soft:#162820; --blue:#7FA6DC; --blue-soft:#152233; --gold:#D1A55A; --gold-soft:#2A2216; --gold-text:#DDB673; --trail:rgba(255,255,255,.5); --trail-bed:rgba(255,255,255,.06); --red:#DE7D70; --red-soft:#2E1B19;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.6); }
/* unit jewel tones */
.u-green{ --u:#2F7D5B; --u-d:#1F5A41; } .u-blue{ --u:#2F5E9E; --u-d:#1F4273; } .u-purple{ --u:#6A4C93; --u-d:#4B356B; }
.u-orange{ --u:#B0643A; --u-d:#824628; } .u-teal{ --u:#2D7C80; --u-d:#1E5A5D; } .u-pink{ --u:#9B3D55; --u-d:#6F2A3C; }

html{ scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px); }
*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
html,body{ background:var(--bg); color:var(--text); font-family:var(--sans); font-weight:400; -webkit-font-smoothing:antialiased; }
body{ min-height:100%; }
button{ font-family:inherit; color:inherit; }
[hidden]{ display:none !important; }
:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; border-radius:10px; }
svg.ic{ fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }

/* top bar */
.topbar{ position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:color-mix(in srgb, var(--bg) 88%, transparent); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); border-bottom:1px solid var(--line); }
.topbar-in{ max-width:680px; margin:0 auto; height:56px; display:flex; align-items:center; gap:10px; padding:0 16px; }
.back{ border:none; background:none; width:36px; height:36px; margin-left:-8px; border-radius:10px; display:flex; align-items:center; justify-content:center; color:var(--dim); cursor:pointer; }
.back svg{ width:22px; height:22px; }
.top-title{ flex:1; font-family:var(--serif); font-weight:600; font-size:1.1rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.top-stats{ display:flex; gap:14px; }
.stat{ display:flex; align-items:center; gap:5px; font-weight:600; font-size:0.92rem; font-variant-numeric:tabular-nums; }
.stat svg{ width:19px; height:19px; }
.stat.fire{ color:var(--gold-text); } .stat.fire.off{ color:var(--mute); } .stat.chk{ color:var(--pri); }
main{ max-width:680px; margin:0 auto; padding:24px 18px calc(var(--tabh) + 44px + env(safe-area-inset-bottom,0px)); }

/* type */
.page-title{ font-family:var(--serif); font-weight:600; font-size:2rem; line-height:1.15; margin-bottom:8px; letter-spacing:-.01em; }
.eyebrow{ font-size:0.7rem; font-weight:600; color:var(--gold-text); text-transform:uppercase; letter-spacing:.14em; margin-bottom:8px; }
.lead{ font-size:1rem; line-height:1.6; color:var(--dim); margin-bottom:22px; max-width:60ch; }
.sec-h{ font-family:var(--serif); font-weight:600; font-size:1.35rem; margin:34px 0 12px; }
.body{ font-size:0.98rem; line-height:1.65; }
.body.small{ font-size:0.9rem; color:var(--dim); margin-top:12px; }
.body b{ color:var(--text); font-weight:600; }
.hint{ font-size:0.88rem; line-height:1.55; color:var(--dim); margin:8px 0 12px; }
.hint b{ color:var(--text); font-weight:600; }
.card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px 18px; box-shadow:var(--shadow); }

/* buttons */
.solid-btn, .ghost-btn, .play-btn, .small-btn, .pop-btn, .speak-btn{ font-family:var(--sans); font-weight:600; cursor:pointer; transition:transform .1s, box-shadow .15s, background .15s, filter .15s; }
.solid-btn, .solid-btn.gold, .solid-btn.blue{ background:var(--ink); color:var(--on-ink); border:none; border-radius:12px; box-shadow:0 1px 0 var(--ink-d), 0 10px 22px -12px rgba(0,0,0,.45); padding:14px 20px; font-size:0.95rem; }
.solid-btn:hover{ filter:brightness(1.15); }
.solid-btn:disabled{ background:var(--line); color:var(--mute); box-shadow:none; cursor:not-allowed; filter:none; }
.ghost-btn{ background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:12px; box-shadow:0 1px 0 var(--line-d); padding:13px 18px; font-size:0.92rem; }
.ghost-btn.danger{ color:var(--red); }
.play-btn, .small-btn{ flex-shrink:0; background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:10px; box-shadow:0 1px 0 var(--line-d); padding:8px 13px; font-size:0.84rem; white-space:nowrap; }
.play-btn.playing, .small-btn.playing{ background:var(--ink); color:var(--on-ink); border-color:var(--ink); }
.solid-btn:active:not(:disabled), .ghost-btn:active, .play-btn:active, .small-btn:active, .pop-btn:active, .speak-btn:active, .row:active, .node:active, .unit-btn:active{ transform:translateY(1px) scale(.99); }
.wide{ width:100%; margin-top:12px; }

/* home: the learning path */
.unit{ position:relative; overflow:hidden; display:flex; align-items:center; gap:12px; background:linear-gradient(135deg, var(--u), var(--u-d)); color:#fff; border-radius:18px; box-shadow:0 14px 30px -18px var(--u-d); padding:20px; margin:12px 0 30px; }
.unit::after{ content:''; position:absolute; right:-40px; top:-60px; width:180px; height:180px; border-radius:50%; background:radial-gradient(circle, rgba(255,255,255,.14), transparent 70%); pointer-events:none; }
.unit-t{ flex:1; min-width:0; }
.unit-k{ font-size:0.68rem; font-weight:600; text-transform:uppercase; letter-spacing:.16em; opacity:.75; }
.unit-n{ font-family:var(--serif); font-size:1.45rem; font-weight:600; line-height:1.2; margin-top:3px; }
.unit-s{ font-size:0.85rem; opacity:.8; margin-top:3px; }
.unit-btn{ position:relative; z-index:1; flex-shrink:0; display:flex; align-items:center; gap:6px; background:rgba(255,255,255,.1); color:#fff; border:1px solid rgba(255,255,255,.3); border-radius:999px; padding:8px 13px; font-weight:600; font-size:0.8rem; cursor:pointer; }
.unit-btn svg{ width:16px; height:16px; }
.path{ display:flex; flex-direction:column; align-items:center; gap:22px; padding:6px 0 36px; }
.node-wrap{ position:relative; transform:translateX(var(--x,0)); }
.node-wrap.has-tip{ margin-top:30px; }
.node{ position:relative; width:64px; height:64px; border-radius:50%; border:none; background:linear-gradient(145deg, var(--u), var(--u-d)); color:#fff; box-shadow:0 2px 0 var(--u-d), 0 12px 24px -10px var(--u); display:flex; align-items:center; justify-content:center; cursor:pointer; transition:transform .12s; }
.node svg{ width:24px; height:24px; }
.node.todo{ background:var(--card); color:var(--mute); border:1px solid var(--line); box-shadow:0 1px 0 var(--line-d), 0 8px 18px -12px rgba(0,0,0,.25); }
.node.done{ background:linear-gradient(145deg, var(--gold-hi), var(--gold-d)); box-shadow:0 2px 0 var(--gold-d), 0 12px 24px -12px var(--gold); }
.node.now{ outline:1.5px solid color-mix(in srgb, var(--u) 45%, transparent); outline-offset:6px; }
.node.open{ transform:scale(1.05); }
.tip{ position:absolute; bottom:calc(100% + 14px); left:50%; transform:translateX(-50%); background:var(--ink); color:var(--on-ink); border-radius:999px; padding:6px 12px; font-weight:600; font-size:0.68rem; text-transform:uppercase; letter-spacing:.14em; white-space:nowrap; animation:bob 2.4s ease-in-out infinite; pointer-events:none; }
.tip::after{ content:''; position:absolute; top:100%; left:50%; margin-left:-5px; border:5px solid transparent; border-top-color:var(--ink); }
@keyframes bob{ 50%{ transform:translate(-50%,-3px); } }
.pop, .pop.todo{ position:relative; width:100%; max-width:340px; background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:16px; box-shadow:0 22px 48px -20px rgba(0,0,0,.4); padding:18px 18px 18px; margin-top:-4px; animation:popIn .18s ease-out; }
.pop::before{ content:''; position:absolute; bottom:100%; left:calc(50% + var(--x,0px)); margin-left:-8px; border:8px solid transparent; border-bottom-color:var(--line); }
.pop::after{ content:''; position:absolute; bottom:calc(100% - 1.5px); left:calc(50% + var(--x,0px)); margin-left:-7px; border:7px solid transparent; border-bottom-color:var(--card); }
.pop-t{ font-family:var(--serif); font-size:1.2rem; font-weight:600; line-height:1.3; }
.pop-s, .pop.todo .pop-s{ font-size:0.9rem; line-height:1.5; color:var(--dim); margin:6px 0 16px; }
.pop-btn, .pop.todo .pop-btn{ width:100%; background:var(--ink); color:var(--on-ink); border:none; border-radius:12px; padding:12px; font-size:0.92rem; }
@keyframes popIn{ from{ opacity:0; transform:translateY(-4px); } }
.principles{ margin-top:10px; }

/* lists */
.list{ display:flex; flex-direction:column; gap:10px; }
.row{ display:flex; align-items:center; gap:14px; text-align:left; background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); padding:14px 16px; cursor:pointer; width:100%; transition:transform .1s, border-color .15s; }
.row:hover{ border-color:var(--line-d); }
.row-n{ flex:0 0 38px; height:38px; border-radius:50%; background:linear-gradient(145deg, var(--u,var(--pri)), var(--u-d,var(--pri-d))); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:600; font-size:0.9rem; }
.row-n.done{ background:linear-gradient(145deg, var(--gold-hi), var(--gold-d)); }
.row-body{ flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }
.row-title{ font-family:var(--serif); font-weight:600; font-size:1.08rem; }
.row-sub{ font-size:0.86rem; color:var(--dim); line-height:1.45; }
.row-meta{ font-size:0.76rem; font-weight:600; color:var(--gold-text); }
.chev{ font-size:1.4rem; color:var(--mute); }

/* lesson */
.step{ display:flex; align-items:center; gap:12px; font-family:var(--serif); font-weight:600; font-size:1.35rem; margin:38px 0 14px; }
.step-n{ flex:0 0 28px; height:28px; border-radius:50%; background:var(--ink); color:var(--on-ink); font-family:var(--sans); font-size:0.8rem; font-weight:600; display:flex; align-items:center; justify-content:center; }
.rule{ font-family:var(--serif); font-weight:500; font-size:1.3rem; line-height:1.5; background:var(--card); border:1px solid var(--line); border-left:3px solid var(--gold); border-radius:14px; padding:16px 18px; box-shadow:var(--shadow); }
.pair{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:14px; box-shadow:var(--shadow); }
.pair-moment{ font-weight:600; font-size:0.98rem; margin-bottom:10px; }
.pair-normal span, .pair-better > span:first-child{ display:block; font-family:var(--sans); font-size:0.66rem; font-weight:600; text-transform:uppercase; letter-spacing:.14em; margin-bottom:4px; }
.pair-normal{ font-size:0.94rem; line-height:1.55; color:var(--dim); background:var(--bg-2); border-radius:10px; padding:10px 14px; }
.pair-normal span{ color:var(--red); }
.pair-better{ margin-top:10px; font-family:var(--serif); font-weight:500; font-size:1.15rem; line-height:1.7; background:var(--pri-soft); border-radius:10px; padding:10px 14px; }
.pair-better > span:first-child{ color:var(--pri); }
.pair-foot{ display:flex; gap:12px; align-items:flex-start; margin-top:12px; }
.pair-note{ font-size:0.88rem; line-height:1.5; color:var(--dim); flex:1; padding-top:6px; }
.pause{ color:var(--gold); font-weight:700; letter-spacing:0.12em; font-family:var(--sans); font-size:.85em; }
.down{ color:var(--gold); font-weight:700; }
.stress{ border-bottom:2px solid var(--gold); }
.w.stress{ font-weight:600; border-bottom:2px solid var(--gold); }
.say-legend{ font-size:0.78rem; color:var(--dim); text-align:center; margin-top:12px; }
.say-legend .stress{ color:var(--text); font-weight:600; }
.breath{ color:var(--gold); font-weight:700; margin:0 4px; }
.script{ font-family:var(--serif); font-weight:500; font-size:1.18rem; line-height:2; background:var(--card); border:1px solid var(--line); border-left:3px solid var(--gold); border-radius:14px; padding:16px 18px; }
.script .note{ display:block; font-family:var(--sans); font-style:italic; font-size:0.84rem; color:var(--dim); line-height:1.5; }
.row-actions{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-top:12px; }
.legend{ font-size:0.8rem; color:var(--dim); display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
.builder{ display:grid; gap:12px; }
.builder label, .settings label{ display:grid; gap:6px; font-size:0.86rem; font-weight:500; color:var(--dim); }
input:not([type]), input[type=text], select, textarea{ width:100%; background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:12px; padding:12px 14px; font:400 0.98rem/1.5 var(--sans); }
input:focus, select:focus, textarea:focus{ outline:none; border-color:var(--gold); box-shadow:0 0 0 3px color-mix(in srgb, var(--gold) 18%, transparent); }
textarea{ min-height:100px; resize:vertical; }
.built{ font-family:var(--serif); font-weight:500; font-size:1.15rem; line-height:1.7; padding:12px 14px; background:var(--bg-2); border-left:3px solid var(--gold); border-radius:10px; }
.timer-card{ display:grid; gap:4px; }
.drill-topic{ font-family:var(--serif); font-weight:600; font-size:1.3rem; line-height:1.4; margin:8px 0 12px; }
.timer-row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.timer{ margin-left:auto; font-weight:600; font-size:1.7rem; font-variant-numeric:tabular-nums; }
.timer.up{ color:var(--red); }
.field-label{ display:block; font-weight:600; font-size:0.94rem; margin:20px 0 8px; }
.rate-row{ display:flex; gap:8px; }
.rate-btn{ width:46px; height:46px; border-radius:50%; border:1px solid var(--line); background:var(--card); font-weight:600; font-size:1rem; cursor:pointer; }
.rate-btn.on{ background:var(--ink); border-color:var(--ink); color:var(--on-ink); }
.end-nav{ display:flex; justify-content:space-between; gap:10px; margin-top:36px; padding-top:20px; border-top:1px solid var(--line); }
details.fold{ margin:14px 0 4px; }
details.fold summary{ cursor:pointer; font-weight:600; font-size:0.92rem; color:var(--gold-text); padding:8px 0; }
details.fold > .how, details.fold > .body{ margin-top:6px; }
.how{ padding-left:20px; }
.how li{ font-size:0.95rem; line-height:1.6; padding:6px 0; }
.how b{ color:var(--text); font-weight:600; }

/* scenario page */
.hero{ position:relative; overflow:hidden; background:linear-gradient(135deg, var(--u), var(--u-d)); color:#fff; border-radius:20px; box-shadow:0 16px 34px -20px var(--u-d); padding:22px 20px 24px; margin-bottom:16px; }
.hero::after{ content:''; position:absolute; right:-50px; top:-70px; width:220px; height:220px; border-radius:50%; background:radial-gradient(circle, rgba(255,255,255,.14), transparent 70%); }
.hero .eyebrow{ color:#fff; opacity:.75; }
.hero .page-title{ margin:2px 0 8px; }
.hero-goal{ font-size:0.98rem; line-height:1.55; opacity:.9; }
.brief p{ font-size:0.95rem; line-height:1.6; margin-bottom:10px; }
.brief p > span{ display:block; font-size:0.66rem; font-weight:600; color:var(--gold-text); text-transform:uppercase; letter-spacing:.14em; margin-bottom:3px; }
.brief .uses{ font-size:0.85rem; color:var(--dim); margin:0; }
.link{ background:none; border:none; color:var(--text); font-weight:600; text-decoration:underline; text-decoration-color:var(--gold); text-underline-offset:3px; cursor:pointer; font-size:inherit; padding:2px; }
.start-btn{ width:100%; margin-top:18px; padding:16px; font-size:1rem; }
.how3{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:22px 0 6px; }
.how3 div{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 12px; font-weight:600; font-size:0.92rem; display:flex; flex-direction:column; gap:4px; }
.how3 b{ font-family:var(--serif); font-size:1.2rem; color:var(--gold); font-weight:600; margin-bottom:2px; }
.how3 span{ font-weight:400; font-size:0.8rem; line-height:1.45; color:var(--dim); }
.script-head{ display:flex; justify-content:space-between; align-items:center; gap:10px; margin:6px 0 12px; flex-wrap:wrap; }
.toggle{ display:flex; gap:8px; align-items:center; font-size:0.88rem; font-weight:500; cursor:pointer; }
.toggle input{ accent-color:var(--gold); width:17px; height:17px; }

/* chat bubbles */
.sc-script{ display:flex; flex-direction:column; gap:12px; }
.sl{ max-width:88%; border-radius:16px; padding:10px 14px 12px; border:1px solid var(--line); background:var(--card); }
.sl.them{ align-self:flex-start; border-bottom-left-radius:6px; }
.sl.them.alt{ background:var(--gold-soft); }
.sl.you{ align-self:flex-end; max-width:92%; background:var(--ink); color:var(--on-ink); border-color:var(--ink); border-bottom-right-radius:6px; }
.sl.stage{ align-self:center; max-width:90%; border:none; background:none; padding:2px 14px; font-style:italic; font-size:0.86rem; color:var(--dim); text-align:center; }
.sl-who{ font-size:0.64rem; font-weight:600; text-transform:uppercase; letter-spacing:.14em; color:var(--mute); margin-bottom:4px; }
.sl.you .sl-who{ color:var(--gold-hi); text-align:right; }
.sl-text{ font-family:var(--serif); font-weight:500; font-size:1.08rem; line-height:1.7; }
.sl.you .pause, .sl.you .down{ color:var(--gold-hi); }
.sl-note{ font-size:0.84rem; line-height:1.5; color:var(--dim); margin-top:8px; padding-top:8px; border-top:1px solid var(--line); }
.sl.you .sl-note{ color:color-mix(in srgb, var(--on-ink) 70%, transparent); border-top-color:color-mix(in srgb, var(--on-ink) 20%, transparent); }
.sc-script.no-coach .sl-note{ display:none; }
.w{ border-radius:4px; transition:background .1s; }
.w.on{ background:var(--gold); color:#fff; box-shadow:0 0 0 2px var(--gold); }

/* practice: full-screen focus mode */
body.focus .topbar, body.focus .tabbar{ display:none; }
body.focus main{ padding-top:16px; padding-bottom:calc(240px + env(safe-area-inset-bottom,0px)); }
.fx-top{ display:flex; align-items:center; gap:14px; margin-bottom:26px; }
.fx-x{ flex:0 0 36px; height:36px; border:none; background:none; color:var(--dim); cursor:pointer; border-radius:10px; display:flex; align-items:center; justify-content:center; }
.fx-x svg{ width:22px; height:22px; }
.pbar{ flex:1; height:6px; border-radius:3px; background:var(--line); overflow:hidden; }
.pbar i{ display:block; height:100%; border-radius:3px; background:linear-gradient(90deg, var(--gold-hi), var(--gold)); transition:width .5s ease; min-width:6px; }

    sub:"High stakes bring adrenaline: faster breathing, a faster voice, a higher pitch. You can't stop the adrenaline, but you can stop it from showing.",
    rule:"Breathe out longer than you breathe in. Pressure only shows when you rush.",
    why:"Under pressure your breathing speeds up and moves into your chest. Your voice follows: it gets <b>faster, higher and thinner</b>, and that's what people read as nerves. A long, slow exhale is the quickest way to calm your body. Breathe in for 4 counts and out for 6. Do it three times before you walk in, and once, quietly, before you answer any hard question. Nobody can see your nerves unless you show them through speed or say them out loud.",
    pairs:[
      {moment:"You feel nervous at the start", normal:"Sorry, I'm a bit nervous today…", better:"[breathe out slowly] ‧‧‧‧‧ Thank you for your time. ‧‧‧ Let's begin. ↘", note:"Announcing your nerves makes everyone notice them. Say nothing, breathe, pause, begin."},
      {moment:"You sit down at the table", normal:"[sit down and start talking immediately, still arranging papers]", better:"[sit, arrange your things, breathe out, look up] ‧‧‧‧‧ Good morning. ↘", note:"Taking three seconds to settle looks like control, not delay.", noPlay:true}],
    drill:{ tag:"Before you speak. Each / is a breath: in for 4, out for 6.", script:[["","breath"],["","breath"],["","breath"],["Thank you for your time.",null],["","pause"],["Let's begin.","down"]],
      note:"Do the three breaths for real, then say the two lines slowly. Notice how your voice sounds lower and steadier than when you start cold. Use this routine before every important meeting, in the car or outside the door." },
    own:"Write the routine you'll do before your next important meeting: where, when, and what you'll say first." },

  { title:"Slow down",
    sub:"Authority sounds unhurried. People trust a voice that seems to have time.",
    rule:"Slower, lower, and steady to the very last word.",
    why:"Three habits make a voice sound junior: <b>speed</b> (rushing to finish), <b>rising pitch</b> (stress pushes your voice up), and <b>fading endings</b> (the last words get quieter). A voice with weight does the opposite. Speak about 20% slower than feels natural, use your natural lower range (don't fake a deep voice), and keep the volume up until the final word. The final word is usually the important one.",
    pairs:[
      {moment:"Opening a presentation", normal:"Hi everyone thanks for coming so today I want to talk about our plan and some numbers and…", better:"Good morning. ‧‧‧ Thank you for coming. ‧‧‧ Today, one decision. ↘", note:"Same content, a third of the words, three times the weight."},
      {moment:"Giving your key number", normal:"…and the return is around twelve percent, so yeah.", better:"The return is ‧‧‧ twelve percent. ↘", note:"Slow down before the number, not after it. Then stop."}],
    drill:{ tag:"Say each line on one breath. Keep the last word as strong as the first.", script:[["Good morning.",null],["","pause"],["Thank you for coming.",null],["","pause-long"],["Today, I'd like to agree on one decision.","down"],["","pause"],["By the end of this meeting,",null],["we'll know the next step.","down"]],
      note:"Record it. Listen for three things: Did you rush? Did your pitch rise? Did the last word fade? Fix one, record again." },
    own:"Write the first two sentences you'd say to open your next important meeting. Then practice them with this voice." },

  { title:"Use silence",
    sub:"Nervous speakers fill every gap. Confident speakers let silence work for them.",
    rule:"Silence instead of \"um\". Hold the silence after important points and before hard answers.",
    why:"Silence does three jobs in a high-stakes meeting. <b>Before an answer</b>, a two-second pause looks thoughtful, not lost. <b>After a key point</b>, it tells the room: this matters. <b>After a number or an offer</b>, it puts pressure on the other side instead of you. Whoever rushes to fill the silence usually gives something away: a discount, a doubt, a weaker version of their point.",
    pairs:[
      {moment:"Stating a price or an offer", normal:"It's around fifty thousand, but we can be flexible, maybe we can discuss…", better:"Fifty thousand. ↘ ‧‧‧‧‧ [stay silent. wait for them.]", note:"Whoever talks first after a number usually gives something away."},
      {moment:"A hard question arrives", normal:"Um, well, so, basically, I mean…", better:"‧‧‧‧‧ That's an important question. ‧‧‧ The short answer is yes. ↘", note:"The pause does the work that \"um\" tries to do, and it looks better."}],
    drill:{ tag:"Hold every long pause fully. It should feel slightly too long.", script:[["[they ask a hard question]","note"],["","pause-long"],["That's a fair question.",null],["","pause"],["The short answer is no.","down"],["","pause-long"],["Here's why.",null]],
      note:"The hardest part is the first silence. Look at the person, breathe out, and wait. Two seconds feels long to you and normal to them." },
    practice:{ secs:30, note:"Get a question. Start the timer. Pause for a full two seconds before your first word, then answer.", list:["Why should we trust you with this?","What's your biggest weakness as a company?","Why is your price higher than others?","What happens if this fails?","Why now?","What's your final offer?","Why did your last project take longer than planned?"] },
    own:"Think of a number you'll need to say in an upcoming meeting (a price, a target, a date). Write how you'll say it, and where you'll stop." },

  { title:"Sound certain",
    sub:"Small words quietly take your authority away. Remove them, and the same idea sounds twice as strong.",
    rule:"Cut the weak words. Let your pitch fall at the end.",
    why:"Listen for these: <b>I think, maybe, just, sort of, kind of, a little bit, sorry but, does that make sense?</b> Each one asks the listener to doubt you. They're useful when you truly are unsure, but most people use them out of habit. Also watch your endings: when your pitch rises at the end, a statement sounds like a question. Being respectful and being certain aren't opposites. You can disagree politely in four words.",
    pairs:[
      {moment:"Disagreeing with someone senior", normal:"Sorry, maybe I'm wrong, but I think maybe…", better:"I see it differently. ‧‧‧ Here's why.", note:"Respectful and clear. No apology for having a view."},
      {moment:"Making a proposal", normal:"I just wanted to maybe suggest that we could sort of try…", better:"I suggest we start with one market. ↘", note:"Seven weak words removed. The idea didn't change, the authority did."},
      {moment:"Checking understanding", normal:"Does that make sense?", better:"What questions do you have?", note:"\"Does that make sense?\" suggests you doubt your own explanation."}],
    drill:{ tag:"↘ means your pitch falls, like setting something down on a table.", script:[["I see it differently.","down"],["","pause"],["The market is ready now,","stress"],["not next year.","down"],["","pause-long"],["I suggest we move this quarter.","down"]],
      note:"Say it once with a rising ending on purpose, so you hear the difference. Then say it correctly three times. In your next real meeting, count how many times you say \"I think\" or \"just\"." },
    own:"Write a sentence you often say at work that contains a weak word. Then rewrite it without it." },

  { title:"Stay still",
    sub:"Senior people read your body before they process your words. Nervous movement is the first thing they notice.",
    rule:"Feet planted. Hands visible and still. One sentence, one person.",
    why:"Swaying, touching your face or pen, adjusting your clothes, and looking at the ceiling while you think all say \"I'm uncomfortable\". <b>Stillness says \"I belong here.\"</b> Sit back slightly, rest your hands on the table where they can be seen, and gesture only to make a point. For eye contact, finish each sentence looking at one person. One cultural note: in Japanese business settings, long direct eye contact can feel intense. Look softly toward the face and share attention with documents rather than holding a stare.",
    pairs:[
      {moment:"While you're speaking", normal:"[rocking in the chair, clicking a pen, looking down while thinking]", better:"[sitting still, hands on the table, finishing each sentence looking at one person]", note:"Movement leaks nerves. Stillness looks like confidence, even when you don't feel it.", noPlay:true},
      {moment:"While they're speaking", normal:"[checking your phone, nodding fast, preparing your answer]", better:"[still, looking at them, a slow nod, a pause before you answer]", note:"How you listen is part of your presence. Fast nodding looks eager, slow nodding looks thoughtful.", noPlay:true}],
    drill:{ tag:"Record a video, not just audio. Seated, like a real meeting.", script:[["Thank you for meeting with me.",null],["","pause"],["I'd like to cover two things.",null],["","pause"],["First, where we are today.",null],["","pause"],["Second, what we need from you.","down"]],
      note:"Watch the video once with the sound off. Do you move, touch your face, or look away at the end of sentences? Fix one habit, then record again." },
    own:"Write the one physical habit you noticed in your video, and what you'll do instead." },

  { title:"Introduce yourself",
    sub:"Your name alone is forgettable. The sentence after your name is what people remember and repeat.",
    rule:"Short name, then one line that says what you do for people. Match the setting.",
    why:"\"I'm Nick, CEO of a real estate company\" gives people a name, a title and a category, and they forget all three. A strong intro has <b>one memorable line</b>: who you help, and what you help them get or avoid. The setting decides the order. <b>Across a table</b>: a short name first, then the line. <b>On a stage or in a pitch</b>: an idea first, then your name. <b>In a formal Japanese meeting</b>: name and company first, done properly, and you stand out later through calm and precision.",
    pairs:[

      {moment:"On a stage or in a pitch", normal:"Hello everyone, my name is Nick, and today I'm going to talk about investing in Cambodia.", better:"Many foreign buyers make one expensive mistake on their first purchase. ‧‧‧ My job is to prevent it. ‧‧‧ I'm Nick.", note:"Idea first, name last. Only make a claim you can back up if someone asks."},
      {moment:"Formal Japanese meeting", normal:"[skipping the ritual to open with a clever line]", better:"はじめまして。Property Hub Cambodiaのニックと申します。", note:"Here the ritual is the respect. Stand out through calm and precision, not by breaking the form.", lang:"ja-JP"}],
    drill:{ tag:"Your table intro. Short name, pause, then the line.", script:[["Good to meet you.",null],["","pause"],["I'm Nick.",null],["","pause"],["I help foreign investors buy in Cambodia","stress"],["without making expensive mistakes.","down"]],
      note:"Once you've built your own line below, drill that instead. Say it until it sounds like something you'd say at dinner, not like a slogan." },
    builder:true,
    practice:{ secs:10, note:"Get a setting, start the timer, and introduce yourself for that setting in under 10 seconds.", list:["Networking event, a stranger asks what you do","First meeting with a potential investor","You're on a panel, introduced third","Phone call with someone you've never met","A senior person you admire, a chance meeting","Formal meeting with a Japanese company"] },
    own:"Write your final table introduction and your final stage introduction. Say both until they sound like you, not like a script." },

  { title:"Say less",
    sub:"Trying to look smart leads to jargon and long answers. What actually impresses senior people is precision, good questions, and brevity.",
    rule:"Be precise. Ask sharp questions. Say less than they expect.",
    why:"Senior people judge intelligence by <b>precision</b> (exact numbers, short sentences), <b>questions</b> that show you understand their situation, <b>listening</b> (answering the real question, not the one you prepared for), and <b>brevity</b>. Two more signals: when you don't know, say so and give a time, because a guessed number destroys trust once it's discovered. And when you're challenged, ask instead of defending. Defending sounds nervous. A question sounds secure.",
    pairs:[
      {moment:"Showing you did your homework", normal:"So, tell me about your company.", better:"You opened in Vietnam last year. ‧‧‧ What made Cambodia the next step?", note:"A specific question impresses people more than anything you say about yourself."},
      {moment:"A question you can't answer", normal:"Um, I'm not sure… maybe around eight percent? I think.", better:"I don't want to give you a rough number on that. ‧‧‧ I'll send you the exact figure tomorrow.", note:"Honesty with a deadline sounds more competent than a guess."},
      {moment:"Being challenged: \"Your numbers look optimistic.\"", normal:"No, no, they're realistic, we checked very carefully, really.", better:"Fair question. ‧‧‧ Which number concerns you most?", note:"The question finds the real doubt, and shows you're not afraid of it."}],
    drill:{ tag:"Answer first, then one reason, then stop.", script:[["Fair question.",null],["","pause"],["Which number concerns you most?",null],["","pause-long"],["[they answer]","note"],["That figure is based on the last three years.",null],["","pause"],["I'll send you the full data today.","down"]],
      note:"Notice what's missing: no defending, no \"really\", no long explanation. The data does the defending for you." },
    practice:{ secs:30, note:"A challenging question. Respond with a precise answer, a question back, or an honest \"I'll check\", then stop.", list:["Your numbers look optimistic.","Why haven't we heard of your company?","What makes you different from everyone else?","Why should we believe your forecast?","Who else have you worked with?","That seems expensive.","What's the biggest risk here?"] },
    own:"Before your next meeting, write three specific questions about the other person's situation. Bring them." },

  { title:"Open and close",
    sub:"People decide how to see you in the first minute and remember you by the last. This lesson puts everything together.",
    rule:"Settle. Greet. Your one line. Purpose. Then, at the end: summary, next step, stop.",
    why:"<b>The first 60 seconds</b>: settle and breathe (Lesson 1), greet with a steady voice (2), pause (3), give your introduction (6), then say why you're here in one sentence, without apologizing for their time. <b>The last 60 seconds</b>: most meetings end with \"so, yeah, that's all\", which wastes the moment people remember most. Instead, summarize in one sentence, state the next step, and stop.",

      note:"Final check: compare this video with your first recording from Lesson 1. The difference is your progress. Then replace the introduction line with your own from Lesson 6." },

function rankVoice(v){ let s=0; if(/premium|enhanced|natural|neural/i.test(v.name)) s+=10; if(/google/i.test(v.name)) s+=4; if(/samantha|daniel|karen|moira|ava|evan|zoe|nathan/i.test(v.name)) s+=3; if(/en[-_]US/i.test(v.lang)) s+=1; return s; }
function pickVoice(){ if(!VOICES.length) return null; const f=VOICES.find(v=>v.name===state.voice); if(f) return f; return VOICES.slice().sort((a,b)=>rankVoice(b)-rankVoice(a))[0]; }
function themVoice(you){ const o=VOICES.filter(v=>you&&v.name!==you.name).sort((a,b)=>rankVoice(b)-rankVoice(a)); return o[0]||you; }
const hasTTS='speechSynthesis' in window;
if(hasTTS){ loadVoices(); speechSynthesis.onvoiceschanged=()=>{ loadVoices(); if(state.route.name==='settings') render(); }; }

/* ---------------- SIMPLE PLAYBACK (lessons) ---------------- */
let tok=0, activeBtn=null, timerId=null;
function stopAll(){ tok++; try{ speechSynthesis.cancel(); }catch(e){}
  if(recAudio){ recAudio.pause(); recAudio=null; }
  if(activeBtn){ activeBtn.classList.remove('playing'); if(activeBtn.dataset.html!==undefined) activeBtn.innerHTML=activeBtn.dataset.html; else activeBtn.textContent=activeBtn.dataset.label; activeBtn=null; }
  document.querySelectorAll('.w.on').forEach(e=>e.classList.remove('on'));
  if(timerId){ clearInterval(timerId); timerId=null; } }
function wait(ms,t){ return new Promise(r=>setTimeout(()=>r(t===tok),ms)); }
function say(text,t,opts={}){ return new Promise(res=>{ if(t!==tok) return res(false);
  const u=new SpeechSynthesisUtterance(text); const v=opts.voice!==undefined?opts.voice:pickVoice();
  if(v&&!opts.lang) u.voice=v; u.lang=opts.lang||(v?v.lang:'en-US'); u.rate=state.rate; u.pitch=opts.pitch||1;
  if(opts.onb) u.onboundary=opts.onb; u.onend=()=>res(t===tok); u.onerror=()=>res(t===tok); speechSynthesis.speak(u); }); }
function segsOf(line){ const out=[]; line.split(/(‧‧‧‧‧|‧‧‧)/).forEach(p=>{ if(p==='‧‧‧') out.push(['','pause']); else if(p==='‧‧‧‧‧') out.push(['','pause-long']); else { const t=p.replace(/\[[^\]]*\]/g,'').trim(); if(t.replace(/↘/g,'').trim()) out.push([t.replace(/[↘*]/g,'').trim(), t.includes('↘')?'down':null]); } }); return out; }
async function playSegs(btn, segs, lang){
  if(!hasTTS){ alert('Voice playback is not supported in this browser.'); return; }
  const same=activeBtn===btn; stopAll(); if(same) return;
  const t=++tok; activeBtn=btn; btn.classList.add('playing'); btn.textContent='■ Stop';
  for(const [txt,type] of segs){
    if(type==='pause'){ if(!await wait(900/state.rate,t)) return; continue; }
    if(type==='pause-long'){ if(!await wait(1900/state.rate,t)) return; continue; }
    if(type==='breath'){ if(!await wait(4000/state.rate,t)) return; continue; }
    if(type==='note'||!txt) continue;
    if(!await say(txt.replace(/[\[\]]/g,''),t,{pitch:type==='down'?0.88:1, lang, voice:lang?null:undefined})) return;
  }
  if(t===tok) stopAll();
}
const playBtn=(attrs,label='▶ Play')=>`<button class="play-btn" type="button" data-label="${label}" ${attrs}>${label}</button>`;

function ymd(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function markDay(){ const t=ymd(new Date()); state.days=state.days||[]; if(!state.days.includes(t)){ state.days.push(t); state.days=state.days.slice(-400); save(); } }
function practicedToday(){ return (state.days||[]).includes(ymd(new Date())); }
function streak(){ const set=new Set(state.days||[]), d=new Date(); if(!set.has(ymd(d))) d.setDate(d.getDate()-1);
  let n=0; while(set.has(ymd(d))){ n++; d.setDate(d.getDate()-1); } return n; }

let pathOpen=null;
function units(){
  return [{name:'Foundation',sub:`${LESSONS.length} lessons · the core skills`,color:'green',list:'lessons',
      items:LESSONS.map((l,i)=>({kind:'lesson',i,title:l.title,sub:l.rule,done:!!state.done[i]}))},
    ...CATS.map(c=>{ const items=SCENARIOS.map((s,i)=>({kind:'scenario',i,title:s.title,sub:s.goal,done:!!state.scDone[i],cat:s.cat})).filter(x=>x.cat===c);
      return {name:c,sub:`${items.length} scenario${items.length>1?'s':''} to practice`,color:catColor(c),list:'scenarios',items}; })];
}
/* The home path is a climb: base camp at the bottom, the summit at the top.
   Each unit is a camp at a higher altitude, and a rank is earned at each one. */
const RANKS=['Newcomer','Composed','Credible','Persuasive','Unshakable','Commanding','Trusted Advisor'];
const CAMPS=['Base Camp','Camp I','Camp II','Camp III','Camp IV','High Camp'];
const ALTS=[800,1600,2400,3200,3900,4500,5000];
const fmtM=m=>`${Math.round(m/10)*10}`.replace(/\B(?=(\d{3})+(?!\d))/g,',')+' m';
function climb(us){ const r0=us.findIndex(u=>!u.items.every(x=>x.done)), r=r0<0?us.length:r0;
  if(r>=us.length) return {r,alt:ALTS[ALTS.length-1]};
  const u=us[r], frac=u.items.filter(x=>x.done).length/u.items.length;
  return {r,alt:ALTS[r]+frac*(ALTS[r+1]-ALTS[r])}; }
function profileSVG(alt){ const W=260,H=92, X=k=>14+k*(222/6), Y=a=>H-8-(a/5000)*(H-18);
  const camps=ALTS.map((a,k)=>[X(k),Y(a)]), seg=ALTS.findIndex(a=>a>alt), k=seg<0?6:Math.max(1,seg),
    t=seg<0?1:(alt-ALTS[k-1])/(ALTS[k]-ALTS[k-1]), me=seg<0?camps[6]:[camps[k-1][0]+(camps[k][0]-camps[k-1][0])*t, camps[k-1][1]+(camps[k][1]-camps[k-1][1])*t];
  const line=pts=>pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('');
  const done=[...camps.slice(0,seg<0?7:k),me];
  return `<svg class="j-prof" viewBox="0 0 ${W} ${H}" aria-hidden="true">
    <path class="j-ridge" d="M0 ${H} L10 ${H-14} L34 ${H-22} L52 ${H-18} L78 ${H-36} L98 ${H-32} L124 ${H-52} L146 ${H-47} L170 ${H-66} L188 ${H-62} L212 ${H-80} L236 ${H-84} L250 ${H-70} L${W} ${H-58} L${W} ${H}Z"/>
    <path class="j-todo" d="${line(camps)}"/><path class="j-done" d="${line(done)}"/>
    ${camps.map((p,i)=>`<circle class="j-camp${ALTS[i]<=alt?' on':''}" cx="${p[0]}" cy="${p[1]}" r="3"/>`).join('')}
    <path class="j-flag" d="M${camps[6][0]} ${camps[6][1]}v-14h9l-2.5 3 2.5 3h-9"/>
    <circle class="j-me-ring" cx="${me[0]}" cy="${me[1]}" r="8"/><circle class="j-me" cx="${me[0]}" cy="${me[1]}" r="4.5"/></svg>`; }
function viewJourney(us){
  const all=us.flatMap(u=>u.items), c=climb(us), next=us[c.r], left=next?next.items.filter(x=>!x.done).length:0;
  const ld=LESSONS.filter((_,i)=>state.done[i]).length, sd=SCENARIOS.filter((_,i)=>state.scDone[i]).length;
  return `<aside class="journey home-rail"><p class="eyebrow">Your climb</p><div class="j-rank">${RANKS[c.r]}</div>
    <p class="j-next">${fmtM(c.alt)}${next?` · next: ${RANKS[c.r+1]}`:''}</p>
    ${profileSVG(c.alt)}${next?`<button class="solid-btn j-cont" type="button" data-act="nextup">Continue · ${esc(nextItem().title)}</button>`:''}</aside>`;
}
function viewHome(){
  const us=units(), now=us.flatMap(u=>u.items).find(x=>!x.done);
  const secs=us.map((u,k)=>{ const complete=u.items.every(x=>x.done);
    const sign=`<div class="camp"><span class="camp-dot" aria-hidden="true"></span><div class="camp-t"><div class="camp-k">${CAMPS[k]} · ${fmtM(ALTS[k])}${complete?' · <span class="camp-ok">✓ Reached</span>':''}</div><div class="camp-n">${esc(u.name)}</div></div>
      <button class="unit-btn" type="button" data-go="${u.list}" aria-label="List ${esc(u.name)}">${ICO.list}</button></div>`;
    const nodes=u.items.map((it,j)=>{ const key=it.kind[0]+it.i, x=XS[j%XS.length], isNow=it===now, open=pathOpen===key, cls=it.done?'done':isNow?'now':'todo';
      return `<div class="node-wrap${isNow?' is-now':''}" style="--x:${x}px">${isNow?`<span class="me" aria-hidden="true">${ICO.flag}</span>`:''}
        <button class="node ${cls}${open?' open':''}" type="button" data-act="node" data-k="${key}" data-s="${cls}" aria-expanded="${open}" aria-label="${esc(it.title)}${it.done?', done':isNow?', you are here':''}">${it.done?ICO.check:it.kind==='lesson'?LICO[it.i]:ICO.chat}</button></div>
        ${open?`<div class="pop${cls==='todo'?' todo':''}" style="--x:${x}px"><div class="pop-t">${esc(it.title)}</div><div class="pop-s">${esc(it.sub)}</div>
          <button class="pop-btn" type="button" ${it.kind==='lesson'?'data-act="ls-start"':'data-act="sc-start"'} data-i="${it.i}">${it.done?(it.kind==='lesson'?'Review':'Practice again'):'Start'}</button></div>`:''}`; }).reverse().join('');
    return `<section class="unit-sec u-${u.color}" data-k="${k}"><div class="path"><svg class="trail" aria-hidden="true"></svg>${nodes}</div>${sign}</section>`; }).reverse().join('');
  return `<div class="home-grid">${viewJourney(us)}<div class="home-main">
    <div class="scene" id="scene"><svg class="scene-bg" aria-hidden="true"></svg>
      <div class="summit${now?'':' reached'}"><div class="summit-k">Summit · ${fmtM(ALTS[6])}</div><div class="summit-t">${RANKS[RANKS.length-1]}</div>${now?'':'<div class="summit-s">You made it.</div>'}</div>
      ${secs}<p class="path-start">Start here ↑</p></div>
    ${now?`<div class="cont-bar"><button class="solid-btn" type="button" data-act="nextup">Continue · ${esc(now.title)}</button></div>`:''}
  <details class="fold principles"><summary>The five principles behind everything</summary><ol class="how">
    <li><b>Never apologize for being there.</b> Not for their time, your nerves, or having a view.</li>
    <li><b>Use fewer words.</b> Short sentences carry more weight.</li>
    <li><b>Answer first.</b> The conclusion, then the reason.</li>
    <li><b>Ask instead of defending.</b> A calm question sounds more secure than any argument.</li>
    <li><b>Let silence work.</b> After a key point, a number, or a hard question.</li></ol></details></div></div>`;
}
/* Trail through each unit's nodes: a worn footpath, solid brass up to where you are, dotted after. */
function drawTrails(){ document.querySelectorAll('.path').forEach(p=>{ const svg=p.querySelector('.trail'); if(!svg) return;
  const pr=p.getBoundingClientRect(), pts=[...p.querySelectorAll('.node')].map(n=>{ const r=n.getBoundingClientRect(); return {x:r.left+r.width/2-pr.left, y:r.top+r.height/2-pr.top, s:n.dataset.s}; });
  let got='', rest='', all='';
  for(let k=1;k<pts.length;k++){ const a=pts[k-1], b=pts[k], m=(b.y-a.y)/2, seg=`M${a.x.toFixed(1)} ${a.y.toFixed(1)}C${a.x.toFixed(1)} ${(a.y+m).toFixed(1)} ${b.x.toFixed(1)} ${(b.y-m).toFixed(1)} ${b.x.toFixed(1)} ${b.y.toFixed(1)}`;
    all+=seg; if(a.s!=='todo'&&b.s!=='todo') got+=seg; else rest+=seg; }
  svg.innerHTML=`<path class="bed" d="${all}"/><path class="rest" d="${rest}"/><path class="got" d="${got}"/>`; }); }

/* The mountain behind the path, drawn to fit the page: sky, distant ranges, the massif with an altitude
   zone per unit (foothills → forest → alpine meadow → rock → snow line → snowfield), trees, rocks, snow, clouds. */
const ZONES={ light:['#AFC6A0','#7FA588','#B9B893','#A99D90','#C4CCD4','#E8EDF1'], dark:['#243A2E','#1E3528','#34352A','#312D2A','#2B323B','#3A424C'] };
function rng(seed){ return ()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function isDark(){ const bg=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim(); return parseInt(bg.slice(1,3),16)<80; }
function shade(hex,f){ const n=parseInt(hex.slice(1),16), c=[n>>16,n>>8&255,n&255].map(v=>Math.max(0,Math.min(255,Math.round(v*f)))); return '#'+c.map(v=>v.toString(16).padStart(2,'0')).join(''); }
function drawScene(){
  const sc=$('scene'); if(!sc) return; const svg=sc.querySelector('.scene-bg'), W=sc.clientWidth, H=sc.scrollHeight, dark=isDark(), R=rng(7), Z=dark?ZONES.dark:ZONES.light;
  const top=sc.getBoundingClientRect().top, cx=W/2, sum=sc.querySelector('.summit'), apex=sum.offsetTop+sum.offsetHeight+34;
  const secs=[...sc.querySelectorAll('.unit-sec')].map(s=>({k:+s.dataset.k, a:s.getBoundingClientRect().top-top, b:s.getBoundingClientRect().bottom-top}));
  const maxHW=Math.min(W*0.42, 250), base=H-260;
  const hw=(y,ph)=>{ const t=y-apex; let w=Math.min(maxHW, 16+t*0.75); if(y>base) w+= (y-base)*1.2; return Math.max(8, w+Math.sin(y/83+ph)*9+Math.sin(y/31+ph*2)*4); };
  const zoneAt=y=>{ const s=secs.find(s=>y>=s.a&&y<=s.b); return s?s.k:(y<apex+200?6:0); };
  let o=`<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="${H}" gradientUnits="userSpaceOnUse">${dark
      ?'<stop offset="0" stop-color="#060A13"/><stop offset=".55" stop-color="#0E1522"/><stop offset="1" stop-color="#1E1A1C"/>'
      :'<stop offset="0" stop-color="#C9D9E6"/><stop offset=".5" stop-color="#E4E6E2"/><stop offset="1" stop-color="#F3E3CB"/>'}</linearGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="0" y2="${H}" gradientUnits="userSpaceOnUse"><stop offset="${(apex/H).toFixed(4)}" stop-color="${dark?'#4A535E':'#F4F6F8'}"/>${
      secs.slice().sort((p,q)=>p.a-q.a).map(s=>`<stop offset="${((s.a+50)/H).toFixed(4)}" stop-color="${Z[s.k]}"/><stop offset="${((s.b-50)/H).toFixed(4)}" stop-color="${Z[s.k]}"/>`).join('')}</linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="${dark?'#E9E4D6':'#FFF4DC'}" stop-opacity=".9"/><stop offset="1" stop-color="${dark?'#E9E4D6':'#FFF4DC'}" stop-opacity="0"/></radialGradient></defs>
    <rect width="${W}" height="${H}" fill="url(#sky)"/>`;
  if(dark){ for(let i=0;i<90;i++){ const y=R()*H*0.7; o+=`<circle cx="${(R()*W).toFixed(1)}" cy="${y.toFixed(1)}" r="${(R()*1.2+.3).toFixed(2)}" fill="#fff" opacity="${(R()*.6+.2).toFixed(2)}"/>`; } }
  const sx=W*0.82, sy=Math.max(60,apex-110);
  o+=`<circle cx="${sx}" cy="${sy}" r="90" fill="url(#glow)" opacity="${dark?.35:1}"/><circle cx="${sx}" cy="${sy}" r="${dark?18:24}" fill="${dark?'#EDE8DA':'#FFF1CF'}"/>${dark?`<circle cx="${sx+10}" cy="${sy-7}" r="15" fill="#080C16"/>`:''}`;
  // distant ranges on both sides, one per camp, paler higher up
  secs.forEach(s=>{ const y0=s.a+70, amp=90; let d=`M0 ${y0}`; for(let q=0;q<=14;q++){ const x=q*W/14; d+=`L${x.toFixed(1)} ${(y0-R()*amp+(Math.abs(x-cx)<maxHW?20:0)).toFixed(1)}`; } d+=`L${W} ${H}L0 ${H}Z`;
    o+=`<path d="${d}" fill="${shade(Z[s.k], dark?1.25:1.08)}" opacity="${dark?.55:.5}"/>`; });
  // the massif
  const step=12; let L=[], Rr=[]; for(let y=apex;y<=H;y+=step){ L.push([cx-hw(y,0),y]); Rr.push([cx+hw(y,2.1),y]); }
  o+=`<path d="M${cx} ${apex-8}${L.map(p=>`L${p[0].toFixed(1)} ${p[1]}`).join('')}L${-20} ${H}L${W+20} ${H}${Rr.reverse().map(p=>`L${p[0].toFixed(1)} ${p[1]}`).join('')}Z" fill="url(#rock)"/>`;
  // snow cap
  let cap=`M${cx} ${apex-8}`; for(let y=apex;y<=apex+170;y+=10) cap+=`L${(cx-hw(y,0)+2).toFixed(1)} ${y}`; for(let x=-1;x<=1;x+=.25) cap+=`L${(cx+x*hw(apex+170,1)*0.9).toFixed(1)} ${(apex+170+Math.sin(x*9)*14+22).toFixed(1)}`; for(let y=apex+170;y>=apex;y-=10) cap+=`L${(cx+hw(y,2.1)-2).toFixed(1)} ${y}`;
  o+=`<path d="${cap}Z" fill="${dark?'#8F99A6':'#FFFFFF'}" opacity="${dark?.55:.9}"/>`;
  // scenery per zone, kept away from the trail in the middle
  const spot=(y,pad)=>{ const w=hw(y,1)-pad; if(w<130) return null; const side=R()<.5?-1:1; return cx+side*(120+R()*(w-120)); };
  secs.forEach(s=>{ const n=Math.round((s.b-s.a)/38);
    for(let i=0;i<n;i++){ const y=s.a+60+R()*(s.b-s.a-120), x=spot(y,14); if(x==null) continue; const z=s.k, c=shade(Z[z],dark?.7:.72), h=12+R()*16;
      if(z<=1&&R()<(z?0.95:.55)) o+=`<path d="M${x.toFixed(1)} ${(y-h).toFixed(1)}l${(h*.42).toFixed(1)} ${h.toFixed(1)}h${(-h*.84).toFixed(1)}Z" fill="${c}"/><path d="M${x.toFixed(1)} ${(y-h*1.5).toFixed(1)}l${(h*.3).toFixed(1)} ${(h*.75).toFixed(1)}h${(-h*.6).toFixed(1)}Z" fill="${c}"/>`;
      else if(z===2||z===3) o+=`<path d="M${(x-h*.5).toFixed(1)} ${y.toFixed(1)}l${(h*.2).toFixed(1)} ${(-h*.5).toFixed(1)}l${(h*.45).toFixed(1)} ${(-h*.15).toFixed(1)}l${(h*.35).toFixed(1)} ${(h*.65).toFixed(1)}Z" fill="${c}" opacity=".8"/>`;
      else if(z>=4) o+=`<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="${(h*1.3).toFixed(1)}" ry="${(h*.35).toFixed(1)}" fill="${dark?'#9AA3AE':'#fff'}" opacity="${dark?.3:.75}"/>`; } });
  // clouds drifting across the slopes

function parseLine(text){ const segs=[]; text.split(/(‧‧‧‧‧|‧‧‧)/).forEach(p=>{ if(p==='‧‧‧') segs.push({type:'pause'}); else if(p==='‧‧‧‧‧') segs.push({type:'pause-long'}); else { const clean=p.replace(/↘/g,'').trim(); if(clean){ const raw=clean.replace(/\[[^\]]*\]/g,'').trim(); segs.push({type:'text',raw,speak:raw.replace(/\*/g,''),down:p.includes('↘')}); } else if(p.includes('↘')) segs.push({type:'down'}); } }); return segs; }
function segHTML(seg,li,si){ if(seg.type==='pause') return '<span class="pause">‧‧‧</span>'; if(seg.type==='pause-long') return '<span class="pause">‧‧‧‧‧</span>'; if(seg.type==='down') return '<span class="down">↘</span>';

  let pos=0, on=false; return seg.raw.split(/(\s+)/).map(w=>{ if(/^\s+$/.test(w)||!w){ pos+=w.length; return w; } const n=(w.match(/\*/g)||[]).length, st=on||n>0, plain=w.replace(/\*/g,''); if(n%2) on=!on;
    const m=st?plain.match(/^(.*?)([.,:;?!]*)$/):[plain,plain,''], s=`<span class="w${st?' stress':''}" data-l="${li}" data-s="${si}" data-c="${pos}">${esc(m[1])}</span>${esc(m[2])}`; pos+=plain.length; return s; }).join('')+(seg.down?' <span class="down">↘</span>':''); }
/* ---------------- MODEL VOICE ----------------
   Each scenario line can have a recorded clip, id "s{scenario}-l{line}". The model plays, in order of preference:
   1. your own take from the Voice studio (IndexedDB, this device), 2. a file listed in AUDIO (e.g. AI voice files
   in the audio/ folder), 3. the browser's speech voice. */
const AUDIO=window.AUDIO_FILES||{};   // from audio/manifest.js (tools/make_voice.py): "s0-l1": {url, start?, stop?}
const MINE={};    // "s0-l1": {url:blobURL, start, stop}, loaded from IndexedDB
const lineId=(si,li)=>`s${si}-l${li}`;
const IDB={ db:null,
  open(){ return this.db||(this.db=new Promise((res,rej)=>{ const r=indexedDB.open('sla-voice',1); r.onupgradeneeded=()=>r.result.createObjectStore('takes'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); })); },
  async req(mode,fn){ const db=await this.open(); return new Promise(res=>{ const q=fn(db.transaction('takes',mode).objectStore('takes')); q.onsuccess=()=>res(q.result); q.onerror=()=>res(null); }); },
  get(k){ return this.req('readonly',s=>s.get(k)); }, set(k,v){ return this.req('readwrite',s=>s.put(v,k)); },
  del(k){ return this.req('readwrite',s=>s.delete(k)); }, keys(){ return this.req('readonly',s=>s.getAllKeys()); } };

function voiceOf(sc,li){ const id=lineId(SCENARIOS.indexOf(sc),li); return state.useMine!==false&&MINE[id]?'your voice':AUDIO[id]?'Mac voice':'browser voice'; }
/* Voiced-time envelope of a clip, so the highlight pauses during silences. null if the clip can't be read. */
const ENV={};
function clipEnv(url){ return ENV[url]||(ENV[url]=(async()=>{ try{
  const AC=window.AudioContext||window.webkitAudioContext, ac=new AC(), buf=await ac.decodeAudioData(await (await fetch(url)).arrayBuffer()); try{ ac.close(); }catch(e){}
  const d=buf.getChannelData(0), fr=Math.max(1,Math.round(buf.sampleRate*0.02)), n=Math.floor(d.length/fr), rms=new Float32Array(n);
  for(let f=0;f<n;f++){ let s=0; for(let k=f*fr;k<(f+1)*fr;k++) s+=d[k]*d[k]; rms[f]=Math.sqrt(s/fr); }
  const so=[...rms].sort((a,b)=>a-b), lo=so[Math.floor(n*0.1)]||0, hi=so[Math.floor(n*0.98)]||0, thr=lo+(hi-lo)*0.12, cum=new Float32Array(n+1);
  for(let f=0;f<n;f++) cum[f+1]=cum[f]+(rms[f]>thr?1:0); return cum; }catch(e){ return null; } })()); }
/* Play a clip and move the word highlight through the line in proportion to word length, over voiced time only. */
const PLAYER=new Audio();
function playClip(c,spans,t){ return new Promise(async res=>{ if(t!==tok) return res(false); const env=spans.length?await clipEnv(c.url):null; if(t!==tok) return res(false);
  const a=PLAYER; a.pause(); a.src=c.url; recAudio=a; a.defaultPlaybackRate=a.playbackRate=Math.min(1.35,Math.max(.7,state.rate/0.85));
  const w=spans.map(s=>s.textContent.length+1), tot=w.reduce((x,y)=>x+y,0)||1; let raf=0, done=false;
  const end=ok=>{ if(done) return; done=true; cancelAnimationFrame(raf); spans.forEach(s=>s.classList.remove('on')); a.pause(); res(ok&&t===tok); };
  const tick=()=>{ if(t!==tok) return end(false); const t0=c.start||0, t1=c.stop||a.duration||0;
    if(c.stop&&a.currentTime>=c.stop) return end(true);
    const at=f=>env[Math.max(0,Math.min(env.length-1,Math.round(f/0.02)))];
    if(t1>t0){ const p=(env&&at(t1)>at(t0)?Math.max(0,(at(a.currentTime)-at(t0))/(at(t1)-at(t0))):Math.max(0,(a.currentTime-t0)/(t1-t0)))*tot; let acc=0, hit=null; for(let i=0;i<spans.length;i++){ acc+=w[i]; if(p<=acc){ hit=spans[i]; break; } } spans.forEach(s=>s.classList.toggle('on',s===hit)); }
    raf=requestAnimationFrame(tick); };
  a.onended=()=>end(true); a.onerror=()=>end(false);
  a.onloadedmetadata=()=>{ if(c.start) a.currentTime=c.start; a.play().then(()=>{ raf=requestAnimationFrame(tick); }).catch(()=>end(false)); };
}); }

/* ---------------- VOICE STUDIO ---------------- */
let stRec=null; const studioOpen=new Set([0]);
async function studioRecord(id){
  if(stRec){ const same=stRec.id===id; stRec.mr.stop(); if(same) return; }
  stopAll();
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){ alert(window.isSecureContext?'This browser can\'t record audio.':'The microphone only works on a secure (https) link.'); return; }
  let stream; try{ stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}}); }catch(e){ alert('Microphone access was blocked. Allow it for this site, then try again.'); return; }
  const mr=new MediaRecorder(stream), chunks=[];
  mr.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
  mr.onstop=async()=>{ stream.getTracks().forEach(x=>x.stop()); stRec=null;
    const blob=new Blob(chunks,{type:mr.mimeType||'audio/mp4'}), r=await analyze(blob);
    if(!r||r.empty){ alert('No speech heard in that take. Try again, a little closer to the microphone.'); render(); return; }
    // keep a little air around the speech so the model starts promptly
    const take={blob, type:blob.type, start:Math.max(0,r.a-0.12), stop:r.b+0.3, at:Date.now()};
    await IDB.set(id,take); if(MINE[id]) URL.revokeObjectURL(MINE[id].url); MINE[id]={url:URL.createObjectURL(blob), start:take.start, stop:take.stop}; render(); };
  stRec={id,mr}; mr.start(); render(); }
async function studioAct(a,btn){ const id=btn.dataset.id;
  if(a==='st-rec') return studioRecord(id);
  if(a==='st-play'){ const c=MINE[id]; if(c) runBtn(btn,t=>playClip(c,[],t)); return; }
  if(a==='st-del'){ if(!confirm('Delete your recording of this line?')) return; await IDB.del(id); if(MINE[id]) URL.revokeObjectURL(MINE[id].url); delete MINE[id]; return render(); }
  if(a==='st-export') return exportTakes(btn); }
function viewStudio(){
  const all=SCENARIOS.flatMap((s,si)=>yourLines(s).map(li=>lineId(si,li))), mine=all.filter(id=>MINE[id]).length;

/* Export takes as a .zip (stored, no compression) with a manifest, to add to the app's audio/ folder for the team. */
function crc32(b){ let c=~0; for(let i=0;i<b.length;i++){ c^=b[i]; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; } return ~c>>>0; }
async function makeZip(files){ const parts=[], cen=[]; let off=0; const enc=new TextEncoder();
  for(const f of files){ const data=new Uint8Array(await f.blob.arrayBuffer()), name=enc.encode(f.name), crc=crc32(data);
    const h=new DataView(new ArrayBuffer(30)); [[0,0x04034b50,4],[4,20,2],[12,0x21,2],[14,crc,4],[18,data.length,4],[22,data.length,4],[26,name.length,2]].forEach(([o,v,n])=>n===4?h.setUint32(o,v,true):h.setUint16(o,v,true));
    const c=new DataView(new ArrayBuffer(46)); [[0,0x02014b50,4],[4,20,2],[6,20,2],[14,0x21,2],[16,crc,4],[20,data.length,4],[24,data.length,4],[28,name.length,2],[42,off,4]].forEach(([o,v,n])=>n===4?c.setUint32(o,v,true):c.setUint16(o,v,true));
    parts.push(h,name,data); cen.push(c,name); off+=30+name.length+data.length; }
  const size=cen.reduce((n,p)=>n+p.byteLength,0), e=new DataView(new ArrayBuffer(22));
  [[0,0x06054b50,4],[8,files.length,2],[10,files.length,2],[12,size,4],[16,off,4]].forEach(([o,v,n])=>n===4?e.setUint32(o,v,true):e.setUint16(o,v,true));
  return new Blob([...parts,...cen,e],{type:'application/zip'}); }
async function exportTakes(btn){ btn.disabled=true; const files=[], manifest={};
  for(const k of (await IDB.keys())||[]){ const v=await IDB.get(k); if(!v||!v.blob) continue; const ext=/mp4|m4a|aac/.test(v.type)?'m4a':/ogg/.test(v.type)?'ogg':'webm';
    files.push({name:`${k}.${ext}`, blob:v.blob}); manifest[k]={url:`audio/${k}.${ext}`, start:+v.start.toFixed(2), stop:+v.stop.toFixed(2)}; }
  files.push({name:'manifest.json', blob:new Blob([JSON.stringify(manifest,null,1)],{type:'application/json'})});
  const a=document.createElement('a'); a.href=URL.createObjectURL(await makeZip(files)); a.download='speak-like-an-advisor-voice.zip'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),5000); btn.disabled=false; }

/* ---------------- LESSON SESSIONS ----------------
   A lesson runs as short cards, one idea per screen (Duolingo style):
   idea → one quiz per example ("Which is stronger?") → say it → drill → [builder] → [timed] → done.
   The long lesson page is still there as "More" (reference: why, notes, rating). */
const LICO=[
 '<path d="M3 8h11a3 3 0 1 0-3-3M3 12h15a3 3 0 1 1-3 3M3 16h7"/>',
 '<path d="M3 12h3l2-5 3 10 3-7 2 2h5"/>',
 '<path d="M9 6v12M15 6v12"/>',
 '<path d="M6 7l11 10M17 9v8H9"/>',
 '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2"/>',
 '<circle cx="12" cy="8" r="3.5"/><path d="M5 20c1-4 4-6 7-6s6 2 7 6"/>',
 '<path d="M5 8h14M5 12h9M5 16h5"/>',
 '<path d="M8 4H5v16h3M16 4h3v16h-3"/>'].map(p=>`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${p}</svg>`);
let lsess=null;
/* A lesson drill as script markup, so it plays and highlights like a scenario line. */
function drillMarkup(script){ return script.map(([t,type])=>type==='pause'?'‧‧‧':type==='pause-long'||type==='breath'?'‧‧‧‧‧':type==='note'?'':type==='down'?`${t} ↘`:type==='stress'?`*${t}*`:t).filter(Boolean).join(' '); }
function lessonCards(i){ const l=LESSONS[i], cards=[{type:'idea'}];
  l.pairs.forEach((p,k)=>cards.push({type:'quiz',k}));
  const k=l.pairs.findIndex(p=>!p.noPlay&&!p.lang);
  if(k>=0) cards.push({type:'say',text:l.pairs[k].better,clip:`l${i}-p${k}`,label:'Say it',title:'Now you say it'});
  cards.push({type:'say',text:drillMarkup(l.drill.script),clip:`l${i}-d`,label:'Drill',title:l.drill.tag});
  if(l.builder) cards.push({type:'builder'});
  if(l.practice) cards.push({type:'timed'});
  cards.push({type:'done'}); return cards; }
function nextItem(){ return units().flatMap(u=>u.items).find(x=>!x.done)||null; }
function nextUp(){ const it=nextItem(); endSession(); endLesson(); if(!it) return go('home'); if(it.kind==='lesson') startLesson(it.i); else startScenario(it.i); }
function startLesson(i){ const from=state.route.name==='lessons'?'lessons':'home'; endSession(); endLesson();
  lsess={i,n:0,cards:lessonCards(i),from}; state.route={name:'lesson',i}; save(); enterCard(); }
function endLesson(){ if(!lsess) return; stopAll(); cancelRec(); lsess.cards.forEach(c=>{ if(c.url) URL.revokeObjectURL(c.url); }); lsess=null; }
function enterCard(){ stopAll(); cancelRec(); const c=lsess.cards[lsess.n], i=lsess.i;
  if(c.url) URL.revokeObjectURL(c.url); Object.assign(c,{step:null,res:null,err:null,url:null});
  if(c.type==='done'){ state.done[i]=true; markDay(); save(); }
  render(); window.scrollTo(0,0);
  const t=++tok;
  if(c.type==='say') return lsListen();
  if(!coachOn()) return;
  if(c.type==='idea') coachSay(`c-lesson${i}-rule`,t);
  else if(c.type==='quiz') coachSay('c-fx-quiz',t);
  else if(c.type==='done') coachSay('c-fx-ldone',t); }
async function lsListen(){ const c=lsess.cards[lsess.n]; stopAll(); c.step='listen'; render(); const t=++tok;
  if(coachOn()&&!lsess.sayIntro){ lsess.sayIntro=true; if(!await coachSay('c-fx-say',t)||!await wait(250,t)) return; }
  if(!await lsModel(t)) return; if(t===tok&&lsess){ c.step='ready'; render(); } }
async function lsModel(t){ const c=lsess.cards[lsess.n], t0=performance.now(), clip=AUDIO[c.clip]; let ok=true;
  if(clip) ok=await playClip(clip,[...document.querySelectorAll('.w[data-l="L"]')],t);
  else for(const s of parseLine(c.text)){
    if(s.type==='pause'){ if(!(ok=await wait(800/state.rate,t))) break; }
    else if(s.type==='pause-long'){ if(!(ok=await wait(1700/state.rate,t))) break; }
    else if(s.type==='text'&&s.speak){ if(!(ok=await say(s.speak,t,{pitch:s.down?0.88:1}))) break; } }
  if(ok&&lsess) c.modelDur=(performance.now()-t0)/1000; return ok; }
function playUrl(url,t){ return new Promise(res=>{ if(!url||t!==tok) return res(false);
  recAudio=new Audio(url); recAudio.onended=()=>res(t===tok); recAudio.onerror=()=>res(false); recAudio.play().catch(()=>res(false)); }); }
async function lsRecord(){ const c=lsess.cards[lsess.n], key=lsess.n; stopAll();
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){ c.err=window.isSecureContext?'nomic':'insecure'; return render(); }
  c.step='arming'; c.err=null; render();
  try{ micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}}); }
  catch(e){ if(lsess&&lsess.n===key){ c.step='ready'; c.err=window.isSecureContext?'denied':'insecure'; render(); } return; }
  if(!lsess||lsess.n!==key||c.step!=='arming'){ releaseMic(); return; }
  const chunks=[], mr=new MediaRecorder(micStream), t0=Date.now();
  mr.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
  mr.onstop=async()=>{ releaseMic(); if(!lsess||lsess.n!==key) return;
    const blob=new Blob(chunks,{type:mr.mimeType||(chunks[0]&&chunks[0].type)||'audio/mp4'});
    if(c.url) URL.revokeObjectURL(c.url); c.url=URL.createObjectURL(blob); c.step='review'; c.res='wait'; render();
    const r=await analyze(blob); if(lsess&&lsess.n===key&&c.step==='review'){ c.res=r; render();
      const k=judgeRes(r,c.modelDur,innerPauses(c.text),key).key; if(coachOn()&&k){ const t=++tok; coachSay('c-fx-'+k,t); } } };
  rec={mr,timer:setInterval(()=>{ const s=(Date.now()-t0)/1000, el=$('recTime'); if(el) el.textContent=s.toFixed(1)+'s'; if(s>=40) stopRec(); },100)};
  mr.start(); c.step='rec'; render(); }
const quizText=t=>esc(t.replace(/[‧↘*]/g,'').replace(/\s+/g,' ').trim()).replace(/\[([^\]]*)\]/g,'<i>$1</i>');
function lessonAct(a,btn){
  if(a==='nextup') return nextUp();
  if(a==='ls-start') return startLesson(+btn.dataset.i);
  if(!lsess) return;
  const c=lsess.cards[lsess.n], P=LESSONS[lsess.i].practice;
  if(a==='ls-exit'){ const f=lsess.from; endLesson(); return go(f); }
  if(a==='ls-next'){ if(lsess.n<lsess.cards.length-1){ lsess.n++; enterCard(); } return; }
  if(a==='ls-why'){ c.why=true; return render(); }
  if(a==='ls-pick'){ if(c.pick) return; c.pick=btn.dataset.o; render(); if(coachOn()){ const t=++tok; coachSay(`c-lesson${lsess.i}-p${c.k}-note`,t); } return; }
  if(a==='ls-listen') return lsListen();
  if(a==='ls-skipaudio'){ stopAll(); c.step='ready'; return render(); }
  if(a==='ls-rec') return lsRecord();
  if(a==='ls-stop') return stopRec();
  if(a==='ls-again'){ stopAll(); cancelRec(); c.step='ready'; c.err=null; return render(); }
  if(a==='ls-pmodel') return runBtn(btn,t=>lsModel(t));
  if(a==='ls-pme') return runBtn(btn,t=>playUrl(c.url,t));
  if(a==='ls-pboth') return runBtn(btn,async t=>{ if(await lsModel(t)&&await wait(400,t)) await playUrl(c.url,t); });
  if(a==='ls-more'){ const i=lsess.i; endLesson(); state.route={name:'lesson',i}; save(); render(); window.scrollTo(0,0); return; }
  if(a==='ls-topic'){ let k; do{ k=Math.floor(Math.random()*P.list.length); }while(k===c.last&&P.list.length>1); c.last=k; c.topic=P.list[k];
    if(timerId){ clearInterval(timerId); timerId=null; } return render(); }
  if(a==='ls-timer'){ if(timerId){ clearInterval(timerId); timerId=null; btn.textContent='Start timer'; return; }
    let s=P.secs; const el=$('ltimer'); el.textContent=s; el.classList.remove('up'); btn.textContent='Stop';
    timerId=setInterval(()=>{ s--; el.textContent=Math.max(s,0); if(s<=0){ clearInterval(timerId); timerId=null; el.textContent='Time'; el.classList.add('up'); btn.textContent='Start timer'; } },1000); }
}
function viewLessonSession(){
  const i=lsess.i, l=LESSONS[i], c=lsess.cards[lsess.n], total=lsess.cards.length-1, pct=Math.round(lsess.n/total*100);
  const top=`<div class="fx-top"><button class="fx-x" type="button" data-act="ls-exit" aria-label="End lesson">${ICO.x}</button>
    <div class="pbar" role="progressbar" aria-label="Lesson progress" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${lsess.n}"><i style="width:${pct}%"></i></div>
    <button class="speed" type="button" data-act="coachv" aria-pressed="${coachOn()}" aria-label="Coach voice">${coachOn()?'Coach on':'Coach off'}</button></div>`;

      ${c.why?`<p class="body ls-why">${l.why}</p>`:`<button class="link-btn ls-left" type="button" data-act="ls-why">Why it works</button>`}`;
    ft=cont(); }
  else if(c.type==='quiz'){ const p=l.pairs[c.k], opts=[{o:'a',t:p.normal},{o:'b',t:p.better}]; if((i+c.k)%2) opts.reverse();
    body=`<p class="eyebrow">${esc(p.moment)}</p><h1 class="fx-title">Which is stronger?</h1>
      <div class="ls-opts">${opts.map(x=>{ const st=!c.pick?'':x.o==='b'?'right':x.o===c.pick?'wrong':'dim';

    if(c.pick){ const ok=c.pick==='b'; cls=ok?'good':'almost';
      ft=`<div class="res" role="status"><span class="res-ic">${ok?ICO.check:ICO.warn}</span><div><div class="res-t">${ok?'Right':'Not quite'}</div><p class="fb-tip">${plainText(p.note)}</p></div></div>${cont()}`; } }
  else if(c.type==='say'){ const st=c.step;
    const card=`<div class="say"><button class="spk" type="button" data-act="${st==='review'?'ls-pmodel':'ls-listen'}" aria-label="Listen">${ICO.spk}</button><div class="say-body"><div class="say-text">${parseLine(c.text).map((s,si)=>segHTML(s,'L',si)).join(' ')}</div></div></div>`;
    body=`<p class="eyebrow">${c.label}</p><h1 class="fx-title">${c.title}</h1>${card}`;
    const skip=`<div class="fx-btns"><button class="ghost-btn" type="button" data-act="ls-next">Skip</button></div>`;
    if(st==='listen'){ body+=`<p class="listening">${eq} Listening</p>`; ft=`<div class="fx-btns"><button class="ghost-btn" type="button" data-act="ls-skipaudio">Skip audio</button></div>`; }
    else if(st==='arming'){ body+=`<button class="speak-btn" type="button" disabled>${ICO.mic}Starting microphone…</button>`; ft=skip; }
    else if(st==='rec'){ body+=`<button class="speak-btn on" type="button" data-act="ls-stop">${eq}Tap to stop · <span id="recTime">0.0s</span></button>`; ft=skip; }
    else if(st==='review'){ const j=judgeRes(c.res,c.modelDur,innerPauses(c.text),lsess.n); cls=j.v;
      body+=`<div class="card cmp"><div class="cmp-row"><span class="cmp-lab">Model</span><span class="cmp-wave">${c.modelDur?c.modelDur.toFixed(1)+'s':''}</span><button class="play-btn" type="button" data-act="ls-pmodel">▶ Play</button></div>
        <div class="cmp-row"><span class="cmp-lab">You</span><span class="cmp-wave">${c.res&&c.res.bars?waveSVG(c.res.bars):''}</span><button class="play-btn" type="button" data-act="ls-pme">▶ Play</button></div>
        <button class="small-btn both" type="button" data-act="ls-pboth">▶ Both</button></div>`;
      ft=`<div class="res" role="status"><span class="res-ic">${j.v==='good'?ICO.check:j.v==='almost'?ICO.warn:ICO.spk}</span><div><div class="res-t">${j.t}</div>${j.tip?`<p class="fb-tip">${j.tip}</p>`:''}</div></div>
        <div class="fx-btns"><button class="ghost-btn" type="button" data-act="ls-again">Try again</button><button class="solid-btn${j.v==='almost'?' gold':j.v==='neutral'?' blue':''}" type="button" data-act="ls-next">Continue</button></div>`; }
    else { body+=`${c.err?`<div class="alert">${MIC_ERR[c.err]}</div>`:''}<button class="speak-btn" type="button" data-act="ls-rec">${ICO.mic}Tap to speak</button>`; ft=skip; } }
  else if(c.type==='builder'){ const n=state.intro;
    body=`<p class="eyebrow">Your line</p><h1 class="fx-title">Build your introduction</h1><div class="card builder">

    body=`<p class="eyebrow">Timed practice</p><h1 class="fx-title">Answer in ${P.secs} seconds</h1>

      <div class="timer-row"><button class="ghost-btn" type="button" data-act="ls-topic">New ${P.secs<=10?'setting':'question'}</button>${c.topic?'<button class="solid-btn" type="button" data-act="ls-timer">Start timer</button>':''}<span class="timer" id="ltimer">${P.secs}</span></div></div>`;
    ft=cont(); }
  else if(c.type==='done'){ const nx=nextItem();
    body=`<div class="done-wrap"><div class="done-badge">${LICO[i]}</div><h1 class="done-title">Lesson complete</h1><p class="lead" style="margin:0 auto">${l.title}</p></div>`;
    ft=`<div class="fx-btns"><button class="ghost-btn" type="button" data-act="ls-more">More</button><button class="solid-btn" type="button" data-act="nextup">${nx?`Next: ${esc(nx.title)}`:'Done'}</button></div>`; }
  return `<div class="u-green">${top}${body}</div>${ft?foot(cls,ft):''}`;
}

/* ---------------- GUIDED PRACTICE (scenarios) ----------------
   One of your lines at a time: listen → record → compare → next.
   Round 1 shows your line (read along). Round 2 hides it (from memory). */
let sess=null, rec=null, micStream=null, recAudio=null;
const SPEEDS=[0.7,0.85,1,1.15];
function altSpeaker(sc,who){ return who!=='you'&&who!=='stage'&&[...new Set(sc.lines.map(x=>x[0]).filter(x=>x!=='you'&&x!=='stage'))].indexOf(who)===1; }
function nameOf(sc,who){ return who==='you'?'You':(who.includes(':')?who.split(':')[1]:sc.them); }
function yourLines(sc){ return sc.lines.map((l,k)=>l[0]==='you'?k:-1).filter(k=>k>=0); }
function contextOf(sc,li){ const out=[]; for(let k=li-1;k>=0&&sc.lines[k][0]!=='you';k--) out.unshift(k); return out.slice(-2); }
function innerPauses(text){ const s=parseLine(text), first=s.findIndex(x=>x.type==='text'), last=s.map(x=>x.type).lastIndexOf('text');
  return s.filter((x,k)=>k>first&&k<last&&(x.type==='pause'||x.type==='pause-long')).length; }
function lineHTML(sc,li){ return parseLine(sc.lines[li][1]).map((s,si)=>segHTML(s,li,si)).join(' '); }

async function speakLine(sc,li,t,yv,tv){
  const [who,text]=sc.lines[li];
  if(who==='stage') return wait(1200/state.rate,t);
  const clip=clipFor(sc,li); if(clip) return playClip(clip,[...document.querySelectorAll(`.w[data-l="${li}"]`)],t);
  const segs=parseLine(text), mine=who==='you', alt=altSpeaker(sc,who);
  for(let si=0;si<segs.length;si++){ const s=segs[si];
    if(s.type==='pause'){ if(!await wait(800/state.rate,t)) return false; continue; }
    if(s.type==='pause-long'){ if(!await wait(1700/state.rate,t)) return false; continue; }
    if(s.type!=='text'||!s.speak) continue;
    const spans=[...document.querySelectorAll(`.w[data-l="${li}"][data-s="${si}"]`)];
    const ok=await say(s.speak,t,{voice:mine?yv:tv, pitch:(s.down?0.88:1)*(!mine&&yv===tv?1.15:1)*(alt?0.85:1), onb:e=>{ if(e.name&&e.name!=='word') return; let hit=null; spans.forEach(x=>{ if(+x.dataset.c<=e.charIndex) hit=x; }); spans.forEach(x=>x.classList.toggle('on',x===hit)); }});
    spans.forEach(x=>x.classList.remove('on')); if(!ok) return false; }
  return true;
}
async function speakModel(t){ const sc=SCENARIOS[sess.i], li=sess.lines[sess.k], yv=pickVoice(), t0=performance.now();
  const ok=await speakLine(sc,li,t,yv,themVoice(yv)); if(ok&&sess) sess.modelDur[li]=(performance.now()-t0)/1000; return ok; }
function playMe(t){ return new Promise(res=>{ if(!sess||!sess.url||t!==tok) return res(false);
  recAudio=new Audio(sess.url); recAudio.onended=()=>res(t===tok); recAudio.onerror=()=>res(false); recAudio.play().catch(()=>res(false)); }); }
async function runBtn(btn,fn){ const same=activeBtn===btn; stopAll(); if(same) return;
  const t=++tok; activeBtn=btn; btn.dataset.html=btn.innerHTML; btn.classList.add('playing'); if(!btn.classList.contains('spk')) btn.textContent='■ Stop';
  await fn(t); if(t===tok) stopAll(); }

/* Start a scenario straight into practice. The first card is the setting (the coach reads it), then the lines.
   Round 2 (from memory) is picked automatically once round 1 is done. */
function startScenario(i){ startSession(i,state.scDone[i]||(state.scR1||{})[i]?2:1,true); }
function startSession(i,round,intro){ const from=sess?sess.from:['home','scenarios'].includes(state.route.name)?state.route.name:'home';
  endSession(); endLesson(); sess={i,round,k:0,lines:yourLines(SCENARIOS[i]),modelDur:{},peek:false,from};
  state.route={name:'scenario',i}; state.lastSc=i; save();
  if(!intro){ enterLine(); window.scrollTo(0,0); return; }
  sess.step='intro'; render(); window.scrollTo(0,0); if(coachOn()){ const t=++tok; coachSay(`c-sc${i}-intro`,t); } }
function endSession(){ stopAll(); cancelRec(); if(sess&&sess.url) URL.revokeObjectURL(sess.url); sess=null; }
function enterLine(){ if(sess.url) URL.revokeObjectURL(sess.url); Object.assign(sess,{url:null,res:null,err:null,peek:false}); listen(); }
async function listen(){ const sc=SCENARIOS[sess.i], li=sess.lines[sess.k], yv=pickVoice(), tv=themVoice(yv), note=sc.lines[li][2];
  stopAll(); sess.step='listen'; render();
  const t=++tok, coach=coachOn();
  if(coach&&!sess.introDone){ sess.introDone=true; if(!await coachSay(sess.round===1?'c-fx-r1':'c-fx-r2',t)||!await wait(300,t)) return; }
  for(const c of contextOf(sc,li)){ if(!await speakLine(sc,c,t,yv,tv)) return; if(!await wait(350/state.rate,t)) return; }
  if(sess.round===1){ if(coach&&note&&(!await coachSay(`c-s${sess.i}-l${li}`,t)||!await wait(250,t))) return; if(!await speakModel(t)) return; }
  else if(coach&&!await coachSay('c-fx-turn',t)) return;
  if(t===tok){ sess.step='ready'; render(); } }

async function startRec(){ stopAll();
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){ sess.err=window.isSecureContext?'nomic':'insecure'; render(); return; }
  sess.step='arming'; sess.err=null; render(); const key=sess.k;
  try{ micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}}); }
  catch(e){ if(sess&&sess.k===key){ sess.step='ready'; sess.err=window.isSecureContext?'denied':'insecure'; render(); } return; }
  if(!sess||sess.k!==key||sess.step!=='arming'){ releaseMic(); return; }
  const chunks=[], mr=new MediaRecorder(micStream), t0=Date.now();
  mr.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
  mr.onstop=async()=>{ releaseMic(); if(!sess||sess.k!==key) return;
    const blob=new Blob(chunks,{type:mr.mimeType||(chunks[0]&&chunks[0].type)||'audio/mp4'});
    if(sess.url) URL.revokeObjectURL(sess.url); sess.url=URL.createObjectURL(blob); sess.step='review'; sess.res='wait'; render();
    const r=await analyze(blob); if(sess&&sess.k===key&&sess.step==='review'){ sess.res=r; render(); const k=judge().key; if(coachOn()&&k){ const t=++tok; coachSay('c-fx-'+k,t); } } };
  rec={mr,timer:setInterval(()=>{ const s=(Date.now()-t0)/1000, el=$('recTime'); if(el) el.textContent=s.toFixed(1)+'s'; if(s>=40) stopRec(); },100)};
  mr.start(); sess.step='rec'; sess.err=null; render(); }
function stopRec(){ if(!rec) return; clearInterval(rec.timer); const r=rec; rec=null; if(r.mr.state!=='inactive') r.mr.stop(); }
function cancelRec(){ if(rec){ clearInterval(rec.timer); rec.mr.onstop=null; if(rec.mr.state!=='inactive') rec.mr.stop(); rec=null; } releaseMic(); }
function releaseMic(){ if(micStream) micStream.getTracks().forEach(x=>x.stop()); micStream=null; }

/* Rough speech measurements from the recording: speaking time, pauses, and a waveform. */
async function analyze(blob){ try{
  const AC=window.AudioContext||window.webkitAudioContext, ac=new AC(), buf=await ac.decodeAudioData(await blob.arrayBuffer()); try{ ac.close(); }catch(e){}
  const d=buf.getChannelData(0), fr=Math.max(1,Math.round(buf.sampleRate*0.02)), n=Math.floor(d.length/fr), rms=new Float32Array(n);
  for(let f=0;f<n;f++){ let s=0; for(let k=f*fr;k<(f+1)*fr;k++) s+=d[k]*d[k]; rms[f]=Math.sqrt(s/fr); }

    else items.push(`<b>Pauses</b> ${r.pauses} of ${exp}. ${r.pauses>exp+2?'Fine if deliberate, not if you were searching for words.':'Right where they belong.'}`); }

function act(a,btn){
  if(a.startsWith('ls-')||a==='nextup') return lessonAct(a,btn);
  if(a==='speed'){ state.rate=SPEEDS.find(x=>x>state.rate+0.001)??SPEEDS[0]; save(); btn.textContent=(+state.rate.toFixed(2))+'×'; return; }
  if(a==='node'){ pathOpen=pathOpen===btn.dataset.k?null:btn.dataset.k; return render(); }
  if(a.startsWith('st-')) return studioAct(a,btn);
  if(a==='coach') return runBtn(btn,t=>coachSay(btn.dataset.k,t));
  if(a==='coachv'){ state.coachVoice=!coachOn(); save(); btn.textContent=coachOn()?'Coach on':'Coach off'; btn.setAttribute('aria-pressed',coachOn()); return; }
  if(a==='sc-start') return startScenario(+btn.dataset.i);
  if(!sess&&a!=='start1'&&a!=='start2') return;
  const i=sess?sess.i:state.route.i;
  if(a==='start1'||a==='start2') return startSession(i,a==='start1'?1:2,true);
  if(a==='round1'||a==='round2') return startSession(i,a==='round1'?1:2);
  if(a==='sc-go') return enterLine();
  if(a==='sc-exit'){ const f=sess.from; endSession(); return go(f); }
  if(a==='exit'){ endSession(); render(); window.scrollTo(0,0); return; }
  if(a==='skip'){ stopAll(); sess.step='ready'; return render(); }
  if(a==='listen') return listen();
  if(a==='peek'){ sess.peek=!sess.peek; return render(); }
  if(a==='rec') return startRec();
  if(a==='stop') return stopRec();
  if(a==='pmodel') return runBtn(btn,t=>speakModel(t));
  if(a==='pme') return runBtn(btn,t=>playMe(t));
  if(a==='pboth') return runBtn(btn,async t=>{ if(await speakModel(t)&&await wait(400,t)) await playMe(t); });
  if(a==='again'){ stopAll(); cancelRec(); sess.step='ready'; sess.err=null; return render(); }
  if(a==='next'){ stopAll(); cancelRec(); if(sess.step==='review') markDay();
    if(sess.k<sess.lines.length-1){ sess.k++; enterLine(); window.scrollTo(0,0); }

}

let trailT; addEventListener('resize',()=>{ clearTimeout(trailT); trailT=setTimeout(()=>{ if(state.route.name==='home') drawScene(); },100); });
if(document.fonts) document.fonts.ready.then(()=>{ if(state.route.name==='home') drawScene(); });
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{ if(state.route.name==='home') drawScene(); });
$('backBtn').addEventListener('click',()=>{ if(sess) act('exit'); else go($('backBtn').dataset.go); });
$('main').addEventListener('click',e=>{ const b=e.target.closest('[data-act]'); if(b) act(b.dataset.act,b); });
load(); render(); if(state.route.name==='home') scrollToNow();
loadMine().then(()=>{ if(['studio','settings'].includes(state.route.name)) render(); });

</script>
</body>
